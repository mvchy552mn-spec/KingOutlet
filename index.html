let supabaseSdkLoadingPromise = null;
function loadSupabaseSdk() {
  if (typeof window !== "undefined" && window.supabase && typeof window.supabase.createClient === "function") {
    return Promise.resolve();
  }
  if (supabaseSdkLoadingPromise) return supabaseSdkLoadingPromise;
  supabaseSdkLoadingPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Impossible de charger le SDK Supabase (Auth indisponible)"));
    document.head.appendChild(script);
  });
  return supabaseSdkLoadingPromise;
}

let supabaseAuthClient = null;
async function getSupabaseAuthClient() {
  if (supabaseAuthClient) return supabaseAuthClient;
  await loadSupabaseSdk();
  supabaseAuthClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  return supabaseAuthClient;
}

async function requireAdmin() {
  const client = await getSupabaseAuthClient();
  const { data: userData, error: userError } = await client.auth.getUser();
  if (userError || !userData || !userData.user) {
    throw new Error("Vous devez être connecté en tant qu'administrateur.");
  }
  if (userData.user.id !== ADMIN_USER_ID) {
    throw new Error("Accès refusé : ce compte n'est pas autorisé comme administrateur.");
  }
  const { data: sessionData, error: sessionError } = await client.auth.getSession();
  if (sessionError || !sessionData || !sessionData.session) {
    throw new Error("Session expirée, veuillez vous reconnecter.");
  }
  return { user: userData.user, accessToken: sessionData.session.access_token };
}

async function detectRealImageType(file) {
  try {
    const buf = await file.slice(0, 12).arrayBuffer();
    const b = new Uint8Array(buf);
    if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return "image/jpeg";
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return "image/png";
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) return "image/webp";
    const ascii = String.fromCharCode(...b.slice(4, 12));
    if (ascii.startsWith("ftyp") && /heic|heix|hevc|hevx|mif1|msf1/.test(ascii)) return "image/heic";
  } catch {
  }
  return null;
}

async function isHeicFile(file) {
  const type = (file.type || "").toLowerCase();
  if (type === "image/heic" || type === "image/heif") return true;
  const name = (file.name || "").toLowerCase();
  const looksHeicByName = name.endsWith(".heic") || name.endsWith(".heif");
  const realType = await detectRealImageType(file);
  if (realType === "image/heic") return true;
  if (realType) return false;
  return looksHeicByName;
}

let heic2anyLoadingPromise = null;
function loadHeic2any() {
  if (typeof window !== "undefined" && typeof window.heic2any === "function") {
    return Promise.resolve();
  }
  if (heic2anyLoadingPromise) return heic2anyLoadingPromise;
  heic2anyLoadingPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Impossible de charger le convertisseur HEIC"));
    document.head.appendChild(script);
  });
  return heic2anyLoadingPromise;
}

async function convertHeicIfNeeded(file) {
  const heic = await isHeicFile(file);
  if (!heic) return file;
  try {
    await loadHeic2any();
  } catch (err) {
    throw new Error("Conversion HEIC indisponible (échec de chargement)");
  }
  if (typeof window.heic2any !== "function") {
    throw new Error("Conversion HEIC indisponible (librairie non chargée)");
  }
  const convertedBlob = await window.heic2any({
    blob: file,
    toType: "image/jpeg",
    quality: 0.9,
  });
  const blob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
  const originalName = (file.name || "photo").replace(/\.(heic|heif)$/i, "");
  return new File([blob], `${originalName}.jpg`, { type: "image/jpeg" });
}

function makeStoragePath(realType) {
  const ext = EXT_BY_MIME[realType] || "jpg";
  const rand = Math.random().toString(36).slice(2, 10);
  return `admin/${Date.now()}-${rand}.${ext}`;

async function uploadToSupabase(file, accessToken, onStep) {
  const trace = (step, ok, detail) => onStep && onStep(step, ok, detail);
  if (!accessToken) {
    trace("connexion", false, "Vous devez être connecté en tant qu'administrateur.");
    throw new Error("Vous devez être connecté en tant qu'administrateur.");
  }
  trace("selection", true, `${file.name || "(sans nom)"} — type déclaré: "${file.type || "(vide)"}"`);
  const realType = await detectRealImageType(file);
  const looksHeicByName = /\.(heic|heif)$/i.test(file.name || "");
  const effectiveType = realType || (ACCEPTED_IMAGE_TYPES.includes(file.type) ? file.type : null);
  if (!effectiveType && !looksHeicByName) {
    trace("conversion", false, "Signature binaire non reconnue comme image (JPEG/PNG/WEBP/HEIC)");
    throw new Error("Ce fichier ne semble pas être une image supportée");
  }
  let usableFile = file;
  const isHeic = effectiveType === "image/heic" || (!realType && looksHeicByName);
  if (isHeic) {
    try {
      usableFile = await convertHeicIfNeeded(file);
      trace("conversion", true, `Converti en JPEG (${(usableFile.size / 1024).toFixed(0)} Ko)`);
    } catch (err) {
      trace("conversion", false, err.message || String(err));
      throw err;
    }
  } else {
    usableFile = effectiveType && effectiveType !== file.type
      ? new File([file], file.name || "photo", { type: effectiveType })
      : file;
    trace("conversion", true, "Aucune conversion nécessaire");
  }
  const finalType = usableFile.type || effectiveType || "image/jpeg";
  const path = makeStoragePath(finalType);
  const uploadUrl = `${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${path}`;
  let res;
  try {
    res = await fetch(uploadUrl, {
      method: "POST",
      headers: {
        "Content-Type": finalType,
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": `Bearer ${accessToken}`,
        "x-upsert": "false",
      },
      body: usableFile,
    });
  } catch (networkErr) {
    trace("connexion", false, `Requête réseau impossible vers Supabase : ${networkErr.message || networkErr}`);
    throw new Error(`Connexion à Supabase impossible : ${networkErr.message || networkErr}`);
  }
  trace("connexion", true, `Réponse reçue du serveur Supabase (HTTP ${res.status})`);
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      detail = body.message || body.error || JSON.stringify(body);
    } catch {
      try { detail = await res.text(); } catch {}
    }
    trace("upload", false, detail);
    throw new Error(`Upload Supabase Storage échoué (${res.status}) : ${detail}`);
  }
  trace("upload", true, `Fichier stocké sous ${SUPABASE_BUCKET}/${path}`);
  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${path}`;
  trace("url", true, publicUrl);
  return { publicUrl, path };
}

function extractSupabasePath(imageUrl) {
  const marker = `/storage/v1/object/public/${SUPABASE_BUCKET}/`;
  const idx = imageUrl.indexOf(marker);
  if (idx === -1) return null;
  return imageUrl.slice(idx + marker.length);
}

async function deleteFromSupabase(imageUrl, accessToken) {
  const path = extractSupabasePath(imageUrl);
  if (!path) return;
  if (!accessToken) {
    console.error("Suppression Supabase Storage refusée : administrateur non authentifié.");
    return;
  }
  const deleteUrl = `${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${path}`;
  const res = await fetch(deleteUrl, {
    method: "DELETE",
    headers: {
      "apikey": SUPABASE_PUBLISHABLE_KEY,
      "Authorization": `Bearer ${accessToken}`,
    },
  });
  if (!res.ok) {
    console.error("Suppression Supabase Storage échouée:", res.status, path);
  }
}

/* ============================================================
   SUPABASE STORAGE — avis vidéo (bucket "customer-reviews")
   ------------------------------------------------------------
   Même principe que product-images : upload/suppression réels via
   l'API REST Storage. Bucket dédié aux vidéos d'avis clients
   (distinct du bucket "product-images"), avec ses propres
   contraintes de type/taille de fichier.
   ============================================================ */

const SUPABASE_VIDEO_BUCKET = "customer-reviews";

const ACCEPTED_VIDEO_TYPES = ["video/mp4", "video/quicktime", "video/webm"];
const VIDEO_EXT_BY_MIME = {
  "video/mp4": "mp4",
  "video/quicktime": "mov",
  "video/webm": "webm",
};
const VIDEO_FILE_INPUT_ACCEPT = "video/*,video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm";

// Limite de taille par fichier vidéo (200 Mo) — ajustable selon les besoins.
const MAX_VIDEO_SIZE_BYTES = 200 * 1024 * 1024;

async function detectRealVideoType(file) {
  try {
    const buf = await file.slice(0, 32).arrayBuffer();
    const b = new Uint8Array(buf);
    // WEBM / MKV (conteneur EBML)
    if (b[0] === 0x1a && b[1] === 0x45 && b[2] === 0xdf && b[3] === 0xa3) return "video/webm";
    // MP4 / MOV : boîte "ftyp" à l'offset 4, avec un "brand" indiquant le sous-type
    const ascii = String.fromCharCode(...b.slice(4, 12));
    if (ascii.startsWith("ftyp")) {
      const brand = ascii.slice(4, 8).toLowerCase();
      if (brand.startsWith("qt")) return "video/quicktime";
      return "video/mp4"; // isom, mp42, mp41, M4V , avc1, etc.
    }
  } catch {
  }
  return null;
}

}

async function uploadVideoToSupabase(file, accessToken, onStep) {
  const trace = (step, ok, detail) => onStep && onStep(step, ok, detail);
  if (!accessToken) {

    throw new Error("Vous devez être connecté en tant qu'administrateur.");
  }
  trace("selection", true, `${file.name || "(sans nom)"} — ${(file.size / (1024 * 1024)).toFixed(1)} Mo`);

  if (file.size > MAX_VIDEO_SIZE_BYTES) {
    trace("validation", false, `Fichier trop volumineux (max ${(MAX_VIDEO_SIZE_BYTES / (1024 * 1024)).toFixed(0)} Mo)`);
    throw new Error(`Cette vidéo dépasse la taille maximale autorisée (${(MAX_VIDEO_SIZE_BYTES / (1024 * 1024)).toFixed(0)} Mo).`);
  }

  const realType = await detectRealVideoType(file);
  const effectiveType = realType || (ACCEPTED_VIDEO_TYPES.includes(file.type) ? file.type : null);
  if (!effectiveType) {
    trace("validation", false, "Format non reconnu (attendu : MP4, MOV ou WEBM)");
    throw new Error("Ce fichier ne semble pas être une vidéo au format accepté (MP4, MOV, WEBM).");
  }
  trace("validation", true, `Format détecté : ${effectiveType}`);

  const path = makeVideoStoragePath(effectiveType);
  const uploadUrl = `${SUPABASE_URL}/storage/v1/object/${SUPABASE_VIDEO_BUCKET}/${path}`;
  let res;
  try {
    res = await fetch(uploadUrl, {
      method: "POST",
      headers: {
        "Content-Type": effectiveType,
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": `Bearer ${accessToken}`,
        "x-upsert": "false",
      },
      body: file,
    });
  } catch (networkErr) {
    trace("connexion", false, `Requête réseau impossible vers Supabase : ${networkErr.message || networkErr}`);
    throw new Error(`Connexion à Supabase impossible : ${networkErr.message || networkErr}`);
  }
  trace("connexion", true, `Réponse reçue du serveur Supabase (HTTP ${res.status})`);
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      detail = body.message || body.error || JSON.stringify(body);
    } catch {
      try { detail = await res.text(); } catch {}
    }
    trace("upload", false, detail);
    throw new Error(`Upload Supabase Storage échoué (${res.status}) : ${detail}`);
  }
  trace("upload", true, `Fichier stocké sous ${SUPABASE_VIDEO_BUCKET}/${path}`);
  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_VIDEO_BUCKET}/${path}`;
  trace("url", true, publicUrl);
  return { publicUrl, path };
}

function extractVideoStoragePath(videoUrl) {

/* ---------------- Scroll reveal system ----------------
   Léger, basé sur IntersectionObserver, respecte prefers-reduced-motion,
   utilise uniquement transform + opacity (perf). Utilisable partout :
   <Reveal><Section /></Reveal> ou <Reveal delay={80}><Card /></Reveal>
------------------------------------------------------------- */
const prefersReducedMotion =
  typeof window !== "undefined" && window.matchMedia
    ? window.matchMedia("(prefers-reduced-motion: reduce)").matches
    : false;

function Reveal({ children, delay = 0, y = 18, blur = true, className = "", as = "div", once = true }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(prefersReducedMotion);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            if (once) io.unobserve(entry.target);
          } else if (!once) {
            setVisible(false);
          }
        });
      },
      { threshold: 0.14, rootMargin: "0px 0px -8% 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [once]);

  const Tag = as;
  return (
    <Tag
      ref={ref}
      className={className}
      style={{
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0) scale(1)" : `translateY(${y}px) scale(0.99)`,
        filter: !prefersReducedMotion && blur ? (visible ? "blur(0px)" : "blur(4px)") : "none",
        transition: prefersReducedMotion
          ? "none"
          : `opacity 0.6s cubic-bezier(0.16,1,0.3,1) ${delay}ms, transform 0.6s cubic-bezier(0.16,1,0.3,1) ${delay}ms, filter 0.5s ease ${delay}ms`,
        willChange: "opacity, transform",
      }}
    >
      {children}
    </Tag>
  );
}

/* Grille avec stagger automatique : chaque enfant direct reçoit un délai croissant */
function RevealGroup({ children, step = 70, y = 16, className = "" }) {
  const items = React.Children.toArray(children);
  return (
    <div className={className}>
      {items.map((child, i) => (
        <Reveal key={child.key ?? i} delay={i * step} y={y}>
          {child}
        </Reveal>
      ))}
    </div>
  );
}

function Hero({ go }) {
  const wrapRef = useRef(null);
  const [parallax, setParallax] = useState(0);
  const [entered, setEntered] = useState(prefersReducedMotion);

  useEffect(() => {
    // Déclenche la chorégraphie d'entrée juste après le premier paint.
    const t = setTimeout(() => setEntered(true), 40);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (prefersReducedMotion) return;
    let raf = null;
    const isMobile = () => window.innerWidth < 768;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const el = wrapRef.current;
        if (el) {
          const rect = el.getBoundingClientRect();
          // Parallax très léger, désactivé sur mobile pour éviter tout effet nauséeux / coût de perf.
          const intensity = isMobile() ? 0 : 1;
          setParallax(Math.max(-36, Math.min(36, rect.top * -0.05 * intensity)));
        }
        raf = null;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // Choréographie d'apparition : fond -> images -> surtitre -> titre -> texte -> CTA
  const stagger = {
    bg: 0,
    images: 90,
    eyebrow: 260,
    title: 340,
    subtitle: 460,
    cta: 560,
  };

  const introStyle = (delay, y = 16, distance = 1) => ({
    opacity: entered ? 1 : 0,
    transform: entered ? "translateY(0)" : `translateY(${y * distance}px)`,
    transition: prefersReducedMotion
      ? "none"
      : `opacity 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}ms, transform 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}ms`,
  });

  const imgIntroStyle = (delay, translate) => ({
    opacity: entered ? 1 : 0,
    transform: entered
      ? `translateY(${translate}px) scale(1)`

function Catalog({ products, brands, initialCategory, initialBrand, forceNew, forceFeatured, onOpen, go }) {
  const [search, setSearch] = useState("");
  const [category, setCategory] = useState(initialCategory || "all");
  const [brand, setBrand] = useState(initialBrand || "all");
  const [size, setSize] = useState("all");
  const [color, setColor] = useState("all");
  const [onlyNew, setOnlyNew] = useState(!!forceNew);
  const [onlyFeatured, setOnlyFeatured] = useState(!!forceFeatured);
  const [sort, setSort] = useState("relevance");
  const [mobileFilters, setMobileFilters] = useState(false);

  useEffect(() => { setCategory(initialCategory || "all"); }, [initialCategory]);
  useEffect(() => { setBrand(initialBrand || "all"); }, [initialBrand]);
  useEffect(() => { setOnlyNew(!!forceNew); }, [forceNew]);
  useEffect(() => { setOnlyFeatured(!!forceFeatured); }, [forceFeatured]);

  const allSizes = useMemo(() => Array.from(new Set(products.flatMap((p) => p.sizes))).sort(), [products]);
  const allColors = useMemo(() => Array.from(new Set(products.flatMap((p) => p.colors))), [products]);

  const filtered = useMemo(() => {
    let list = products.filter((p) => {
      if (search && !(`${p.name} ${p.reference}`.toLowerCase().includes(search.toLowerCase()))) return false;
      if (category !== "all" && p.categoryId !== category) return false;
      if (brand !== "all" && p.brandId !== brand) return false;
      if (size !== "all" && !p.sizes.includes(size)) return false;
      if (color !== "all" && !p.colors.includes(color)) return false;
      if (onlyNew && !p.isNew) return false;
      if (onlyFeatured && !p.featured) return false;
      return true;
    });
    if (sort === "name") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    if (sort === "new") list = [...list].sort((a, b) => Number(b.isNew) - Number(a.isNew));
    return list;
  }, [products, search, category, brand, size, color, onlyNew, onlyFeatured, sort]);

  const Filters = () => (
    <div className="space-y-6">
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Catégorie</label>
        <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
          <option value="all">Toutes</option>
          {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Marque</label>
        <select value={brand} onChange={(e) => setBrand(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
          <option value="all">Toutes</option>
          {brands.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
        </select>
      </div>
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Taille</label>
        <select value={size} onChange={(e) => setSize(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
          <option value="all">Toutes</option>
          {allSizes.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Couleur</label>
        <select value={color} onChange={(e) => setColor(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
          <option value="all">Toutes</option>
          {allColors.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <label className="flex items-center gap-2 text-sm" style={{ fontFamily: "Inter", color: COLORS.ink }}>
        <input type="checkbox" checked={onlyNew} onChange={(e) => setOnlyNew(e.target.checked)} />
        Nouveautés uniquement
      </label>
      <label className="flex items-center gap-2 text-sm" style={{ fontFamily: "Inter", color: COLORS.ink }}>
        <input type="checkbox" checked={onlyFeatured} onChange={(e) => setOnlyFeatured(e.target.checked)} />
        Mis en avant uniquement
      </label>
      <button
        onClick={() => { setSearch(""); setCategory("all"); setBrand("all"); setSize("all"); setColor("all"); setOnlyNew(false); setOnlyFeatured(false); }}
        className="text-xs uppercase tracking-widest underline"
        style={{ color: COLORS.magenta, fontFamily: "Inter" }}
      >
        Réinitialiser les filtres
      </button>
    </div>
  );

  return (
    <section className="max-w-7xl mx-auto px-5 md:px-8 py-12">
      <Eyebrow>Catalogue</Eyebrow>
      <div className="flex items-end justify-between flex-wrap gap-4 mt-3 mb-8">
        <h1 style={{ fontFamily: "Anton", fontSize: "clamp(28px,5vw,44px)", color: COLORS.ink }}>TOUT LE CATALOGUE</h1>
        <div className="flex items-center gap-3 flex-wrap">
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Rechercher un produit, une référence…"
            className="px-4 py-2.5 text-sm rounded-sm w-64 max-w-full"
            style={selectStyle}
          />
          <select value={sort} onChange={(e) => setSort(e.target.value)} className="px-3 py-2.5 text-sm rounded-sm" style={selectStyle}>
            <option value="relevance">Pertinence</option>
            <option value="name">Nom (A–Z)</option>
            <option value="new">Nouveautés d'abord</option>
          </select>
          <button
            className="lg:hidden px-4 py-2.5 text-xs uppercase tracking-widest border rounded-sm"
            style={{ borderColor: COLORS.line, color: COLORS.ink, fontFamily: "Inter" }}
            onClick={() => setMobileFilters(true)}
          >
            Filtres
          </button>
        </div>
      </div>

      <div className="grid lg:grid-cols-[220px_1fr] gap-10">
        <aside className="hidden lg:block">
          <Filters />
        </aside>

        <div>
          <div className="text-xs mb-4" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>{filtered.length} produit{filtered.length > 1 ? "s" : ""}</div>
          {filtered.length === 0 ? (
            <div className="py-24 text-center border rounded-sm" style={{ borderColor: COLORS.line }}>
              <div style={{ fontFamily: "Anton", fontSize: 24, color: COLORS.ink }}>AUCUN RÉSULTAT</div>
              <p className="mt-2 text-sm" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Essayez d'élargir vos filtres ou votre recherche.</p>
            </div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-3 gap-5 md:gap-6">
              {filtered.map((p) => (
                <ProductCard key={p.id} product={p} brand={brands.find((b) => b.id === p.brandId)} onOpen={onOpen} />
              ))}
            </div>
          )}
        </div>
      </div>

      {mobileFilters && (
        <div className="fixed inset-0 z-50 lg:hidden">
          <div className="absolute inset-0 bg-black/70" onClick={() => setMobileFilters(false)} />
          <div className="absolute right-0 top-0 bottom-0 w-80 max-w-[85vw] p-6 overflow-y-auto" style={{ background: COLORS.surface }}>
            <div className="flex items-center justify-between mb-6">
              <div style={{ fontFamily: "Anton", fontSize: 20, color: COLORS.ink }}>FILTRES</div>
              <button onClick={() => setMobileFilters(false)} style={{ color: COLORS.ink }}>✕</button>
            </div>
            <Filters />
            <SolidButton className="w-full mt-6" onClick={() => setMobileFilters(false)}>Voir les résultats</SolidButton>
          </div>
        </div>
      )}
    </section>
  );
}

/* ---------------- Product page ---------------- */

function ProductGallery({ product }) {
  const [activeImg, setActiveImg] = useState(0);
  const [displayImg, setDisplayImg] = useState(0);
  const [fading, setFading] = useState(false);
  const [zoomOpen, setZoomOpen] = useState(false);
  const touchStart = useRef(null);
  const fadeTimeout = useRef(null);

  useEffect(() => {
    setActiveImg(0);
    setDisplayImg(0);
  }, [product.id]);

  useEffect(() => {
    if (displayImg === activeImg) return;
    setFading(true);
    fadeTimeout.current && clearTimeout(fadeTimeout.current);
    fadeTimeout.current = setTimeout(() => {
      setDisplayImg(activeImg);
      setFading(false);
    }, 160);
    return () => fadeTimeout.current && clearTimeout(fadeTimeout.current);
  }, [activeImg]);

  const goTo = (i) => setActiveImg(((i % product.images.length) + product.images.length) % product.images.length);

  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStart.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStart.current;
    if (dx > 50) goTo(activeImg - 1);
    if (dx < -50) goTo(activeImg + 1);
    touchStart.current = null;
  };

  return (
    <div className="w-full max-w-full min-w-0">
      {/* Image principale — carrée, cadrage net, produit centré sans vide excessif.
          Cadre 100% de la largeur disponible, jamais plus large que l'écran ; l'image est
          toujours contenue et centrée à l'intérieur (object-contain + flex center), jamais
          déformée, jamais débordante. */}
      <div
        className="relative w-full max-w-full rounded-lg overflow-hidden cursor-zoom-in select-none"
        style={{
          aspectRatio: "1/1",
          background: `radial-gradient(120% 100% at 50% 8%, ${COLORS.surface2} 0%, ${COLORS.surface} 55%, #0C0913 100%)`,
          boxShadow: `0 0 0 1px ${COLORS.line}, 0 30px 60px -30px rgba(0,0,0,0.7)`,
        }}
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
        onClick={() => setZoomOpen(true)}
      >
        <div className="absolute inset-0 flex items-center justify-center p-5 sm:p-7">
          <img
            src={product.images[displayImg]}
            alt={product.name}
            className="max-w-full max-h-full w-auto h-auto object-contain drop-shadow-[0_25px_40px_rgba(0,0,0,0.55)] transition-all duration-300 ease-out"
            style={{ opacity: fading ? 0 : 1, transform: fading ? "scale(0.985)" : "scale(1)" }}
            onError={handleImgError}
            loading="eager"
            decoding="async"
          />
        </div>
        <TagCorner />
        <div className="absolute top-3 left-3 flex gap-2">
          {product.isNew && <Badge tone="new">Nouveau</Badge>}
          {product.featured && <Badge tone="dark">En avant</Badge>}
        </div>
        {product.images.length > 1 && (
          <div
            className="absolute bottom-3 right-3 px-2.5 py-1 rounded-sm text-[10px] font-mono"
            style={{ background: "rgba(8,6,13,0.65)", color: COLORS.inkDim }}
          >
            {displayImg + 1} / {product.images.length}
          </div>
        )}
        <div
          className="absolute bottom-3 left-3 px-2.5 py-1 rounded-sm text-[10px] uppercase tracking-widest hidden sm:flex items-center gap-1"
          style={{ background: "rgba(8,6,13,0.55)", color: COLORS.inkDim, fontFamily: "Inter" }}
        >
          ⤢ Cliquer pour zoomer
        </div>
      </div>

      {/* Miniatures — carrées, nettes, cadrage cohérent avec l'image principale.
          Rangée en défilement horizontal CONTENU (overflow-x-auto + w-full + min-w-0) : c'est
          le seul endroit de la page où un défilement horizontal est volontaire et acceptable —
          il reste strictement à l'intérieur de son propre cadre, jamais sur toute la page. */}
      {product.images.length > 1 && (
        <div className="flex gap-3 mt-4 w-full max-w-full min-w-0 overflow-x-auto overscroll-x-contain pb-1">
          {product.images.map((im, i) => (
            <button
              key={i}
              onClick={() => goTo(i)}
              className="relative shrink-0 rounded-md overflow-hidden transition-all duration-200"
              style={{
                width: 68,
                height: 68,
                background: `radial-gradient(120% 120% at 50% 10%, ${COLORS.surface2} 0%, ${COLORS.surface} 100%)`,
                boxShadow: activeImg === i ? `0 0 0 2px ${COLORS.magenta}, 0 0 14px rgba(255,46,196,0.4)` : `0 0 0 1px ${COLORS.line}`,
                opacity: activeImg === i ? 1 : 0.55,
              }}
            >
              <img src={im} alt="" className="absolute inset-0 w-full h-full object-contain p-1.5" onError={handleImgError} loading="lazy" />
            </button>
          ))}
        </div>
      )}

      {/* Rendu via portail directement dans <body> : la galerie est nichée dans un ancêtre animé
          (transform CSS actif en permanence pour l'effet d'apparition au scroll), ce qui casserait
          le positionnement "fixed" plein écran de ce zoom s'il restait dans l'arbre React normal. */}
      {zoomOpen && ReactDOM.createPortal(
        <div
          className="fixed inset-0 z-[70] flex items-center justify-center p-4 sm:p-10"
          style={{ background: "rgba(5,4,9,0.94)" }}
          onClick={() => setZoomOpen(false)}
        >
          <button
            onClick={() => setZoomOpen(false)}
            className="absolute top-4 right-4 sm:top-6 sm:right-6 w-10 h-10 rounded-full flex items-center justify-center text-lg"
            style={{ background: COLORS.surface2, color: COLORS.ink }}
            aria-label="Fermer le zoom"
          >
            ✕
          </button>
          <img
            src={product.images[displayImg]}
            alt={product.name}
            className="max-w-full max-h-full object-contain"
            onClick={(e) => e.stopPropagation()}
            onError={handleImgError}
          />
          {product.images.length > 1 && (
            <>
              <button
                onClick={(e) => { e.stopPropagation(); goTo(activeImg - 1); }}
                className="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full flex items-center justify-center"
                style={{ background: "rgba(255,255,255,0.08)", color: COLORS.ink }}
                aria-label="Image précédente"
              >‹</button>
              <button
                onClick={(e) => { e.stopPropagation(); goTo(activeImg + 1); }}
                className="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full flex items-center justify-center"
                style={{ background: "rgba(255,255,255,0.08)", color: COLORS.ink }}
                aria-label="Image suivante"
              >›</button>
            </>
          )}
        </div>,
        document.body
      )}
    </div>
  );
}

/* Ligne détail produit — libellé au-dessus de la valeur sur mobile (empêche tout débordement
   horizontal avec des valeurs longues), côte-à-côte à partir de "sm". La valeur revient toujours
   à la ligne librement (jamais de troncature ni de dépassement d'écran). */
function DetailRow({ label, value, mono }) {
  if (value == null || value === "") return null;
  return (
    <div className="flex flex-col gap-0.5 sm:flex-row sm:items-baseline sm:justify-between sm:gap-6">
      <span className="shrink-0">{label}</span>
      <span
        className={`break-words sm:text-right ${mono ? "font-mono" : ""}`}
        style={{ color: COLORS.ink }}
      >
        {value}
      </span>
    </div>
  );
}

/* Accordéon compact — une section ouverte à la fois, pour éviter les pavés de texte empilés */
function InfoAccordion({ sections, defaultOpen }) {
  const [openId, setOpenId] = useState(defaultOpen || null);
  return (
    <div className="mt-7 border-t" style={{ borderColor: COLORS.line }}>
      {sections.map((s) => {
        const isOpen = openId === s.id;
        return (
          <div key={s.id} className="border-b" style={{ borderColor: COLORS.line }}>
            <button
              onClick={() => setOpenId(isOpen ? null : s.id)}
              className="w-full flex items-center justify-between py-4 text-left"
            >
              <span className="text-xs uppercase tracking-widest font-semibold" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{s.label}</span>
              <svg
                width="11" height="11" viewBox="0 0 9 9" fill="none"
                style={{ transition: "transform .2s ease", transform: isOpen ? "rotate(180deg)" : "rotate(0deg)", flexShrink: 0 }}
              >
                <path d="M1 2.5L4.5 6L8 2.5" stroke={COLORS.inkDim} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </button>
            <div
              style={{
                maxHeight: isOpen ? 600 : 0,
                overflow: "hidden",
                transition: "max-height .3s ease",
              }}
            >
              <div className="pb-4 text-sm leading-relaxed" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
                {s.content}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ProductPage({ product, brand, products, brands, onOpen, go, onAddToCart }) {
  const [selSize, setSelSize] = useState(product.sizes[0] || null);
  const [selColor, setSelColor] = useState(product.colors[0] || null);
  const [qty, setQty] = useState(1);
  const [descExpanded, setDescExpanded] = useState(false);
  const [justAdded, setJustAdded] = useState(false);

  useEffect(() => { setSelSize(product.sizes[0] || null); setSelColor(product.colors[0] || null); setQty(1); setDescExpanded(false); }, [product.id]);

  const similar = products.filter((p) => p.id !== product.id && p.categoryId === product.categoryId).slice(0, 4);
  const categoryLabel = CATEGORIES.find((c) => c.id === product.categoryId)?.name;
  const isShoe = product.categoryId === "chaussures";
  const isLongDesc = (product.description || "").length > 140;

  const handleAddToCart = () => {
    onAddToCart({
      productId: product.id,
      name: product.name,
      brandName: brand?.name || "",
      reference: product.reference || "",
      price: product.price != null ? product.price : null,
      image: product.images && product.images[0] ? product.images[0] : null,
      size: selSize || null,
      sizeLabel: isShoe ? "Pointure" : "Taille",
      color: selColor || null,
      quantity: qty,
      categoryId: product.categoryId,
    });
    setJustAdded(true);
    setTimeout(() => setJustAdded(false), 1800);
  };

  return (
    <section className="max-w-7xl mx-auto px-5 md:px-8 py-10 overflow-x-hidden">
      <button onClick={() => go("catalog")} className="text-xs uppercase tracking-widest mb-6 inline-flex items-center gap-1.5" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
        ← Retour au catalogue
      </button>

      {/* min-w-0 sur les deux colonnes : empêche une grille CSS de forcer la largeur d'un
          élément (galerie, miniatures, texte long) au-delà de la largeur d'écran disponible —
          cause racine des débordements horizontaux constatés sur mobile. */}
      <div className="grid md:grid-cols-2 gap-10 lg:gap-16 w-full max-w-full overflow-x-hidden md:overflow-visible">
        {/* Galerie — dominante */}
        <Reveal y={22} className="min-w-0 w-full max-w-full">
          <ProductGallery product={product} />
        </Reveal>

        {/* Informations — structure éditoriale */}
        <Reveal delay={120} y={22} className="min-w-0 w-full max-w-full">
          <div className="min-w-0">
            <div className="text-xs uppercase tracking-widest" style={{ color: COLORS.magenta, fontFamily: "Inter" }}>{brand?.name}</div>
            <h1 className="mt-2 leading-tight break-words" style={{ fontFamily: "Anton", fontSize: "clamp(30px,4vw,44px)", color: COLORS.ink }}>{product.name.toUpperCase()}</h1>
            <div className="mt-2 flex items-center gap-3 flex-wrap">
              <span className="text-xs font-mono break-words" style={{ color: COLORS.inkDim }}>Réf. {product.reference}</span>
              {product.price != null && (
                <span className="text-lg font-semibold" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{product.price} €</span>
              )}
              <span className="text-xs" style={{ fontFamily: "Inter" }}>
                {product.availability
                  ? <span style={{ color: COLORS.green }}>● Disponible</span>
                  : <span style={{ color: "#FF5C7A" }}>● Rupture de stock</span>}
              </span>
            </div>

            {product.description && (
              <div className="mt-6 max-w-md">
                <p
                  className="text-sm leading-relaxed break-words"
                  style={{
                    color: COLORS.inkDim,
                    fontFamily: "Inter",
                    display: "-webkit-box",
                    WebkitBoxOrient: "vertical",
                    WebkitLineClamp: descExpanded ? "unset" : 3,
                    overflow: descExpanded ? "visible" : "hidden",
                  }}
                >
                  {product.description}
                </p>
                {isLongDesc && (
                  <button
                    onClick={() => setDescExpanded((v) => !v)}
                    className="mt-1.5 text-xs uppercase tracking-widest font-semibold"
                    style={{ color: COLORS.magenta, fontFamily: "Inter" }}
                  >
                    {descExpanded ? "Réduire ↑" : "Lire plus ↓"}
                  </button>
                )}
              </div>
            )}

            {product.colors.length > 0 && (
              <div className="mt-7 pt-6 border-t" style={{ borderColor: COLORS.line }}>
                <div className="text-[11px] uppercase tracking-widest mb-3" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
                  Couleur <span style={{ color: COLORS.ink }}>— {selColor}</span>
                </div>
                <div className="flex gap-2.5 flex-wrap">
                  {product.colors.map((c) => (
                    <button
                      key={c}
                      onClick={() => setSelColor(c)}
                      className="w-9 h-9 rounded-full transition-transform duration-150 hover:scale-110"
                      style={{
                        background: COLOR_SWATCHES[c] || "#444",
                        boxShadow: selColor === c ? `0 0 0 2px ${COLORS.bg}, 0 0 0 4px ${COLORS.magenta}, 0 0 12px rgba(255,46,196,0.5)` : `0 0 0 1px ${COLORS.line}`,
                      }}
                      aria-label={c}
                      title={c}
                    />
                  ))}
                </div>
              </div>
            )}

            {product.sizes.length > 0 && (
              <div className="mt-6 pt-6 border-t" style={{ borderColor: COLORS.line }}>
                <div className="text-[11px] uppercase tracking-widest mb-3" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
                  {isShoe ? "Pointure" : "Taille"}
                </div>
                <div className="flex flex-wrap gap-2">
                  {product.sizes.map((s) => (
                    <button
                      key={s}
                      onClick={() => setSelSize(s)}
                      className="min-w-[46px] px-3 py-2.5 text-sm rounded-sm transition-all duration-150"
                      style={{
                        border: `1px solid ${selSize === s ? COLORS.magenta : COLORS.line}`,
                        background: selSize === s ? "rgba(255,46,196,0.08)" : "transparent",
                        color: selSize === s ? COLORS.magenta : COLORS.ink,
                        fontFamily: "Inter",
                      }}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="mt-8 flex flex-col xs:flex-row xs:items-center gap-4">
              <div className="flex items-center justify-center gap-3 border rounded-sm px-1 w-full xs:w-auto" style={{ borderColor: COLORS.line }}>
                <button onClick={() => setQty((q) => Math.max(1, q - 1))} className="w-9 h-11 text-lg shrink-0" style={{ color: COLORS.ink }} aria-label="Diminuer la quantité">−</button>
                <span className="text-sm w-5 text-center shrink-0" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{qty}</span>
                <button onClick={() => setQty((q) => q + 1)} className="w-9 h-11 text-lg shrink-0" style={{ color: COLORS.ink }} aria-label="Augmenter la quantité">+</button>
              </div>
              <button
                onClick={handleAddToCart}
                disabled={!product.availability}
                className="w-full xs:w-auto xs:flex-1 px-7 py-3.5 rounded-sm text-sm font-semibold uppercase tracking-wider transition-transform duration-150 hover:scale-[1.02] disabled:opacity-40 disabled:cursor-not-allowed whitespace-normal"
                style={{ background: justAdded ? COLORS.green : COLORS.ink, color: COLORS.bg, fontFamily: "Inter" }}
              >
                {justAdded ? "Ajouté ✓" : "Ajouter au panier"}
              </button>
            </div>

            <div className="mt-4 flex flex-col sm:flex-row sm:flex-wrap gap-3 sm:gap-4">
              <SolidButton
                onClick={() => go("contact")}
                className="!px-8 !py-4 !text-base tracking-wider w-full sm:w-auto whitespace-normal"
              >
                Nous contacter pour ce produit
              </SolidButton>
              <GhostButton onClick={() => go("catalog")} className="w-full sm:w-auto whitespace-normal">Continuer à explorer</GhostButton>
            </div>

            {/* Détails, groupés en accordéon pour éviter le pavé de texte.
                Chaque ligne empile le libellé au-dessus de la valeur sur mobile (la valeur peut
                être longue et revenir à la ligne librement), et repasse en ligne côte-à-côte à
                partir de "sm" — comme demandé, plus aucune valeur ne peut sortir de l'écran. */}
            <InfoAccordion
              defaultOpen="details"
              sections={[
                {
                  id: "details",
                  label: "Détails du produit",
                  content: (
                    <div className="space-y-3">
                      <DetailRow label="Catégorie" value={categoryLabel} />
                      <DetailRow label="Marque" value={brand?.name} />
                      <DetailRow label="Référence" value={product.reference} mono />
                      <DetailRow label="Authenticité" value="Garantie" />
                    </div>
                  ),
                },
                {
                  id: "livraison",
                  label: "Livraison & retours",
                  content: (
                    <div className="space-y-3">
                      <DetailRow label="Livraison" value="Partout en France" />
                      <DetailRow label="Main propre" value="Paris & IDF" />
                      <DetailRow label="Service client" value="7j/7" />
                    </div>
                  ),
                },
              ]}
            />
          </div>
        </Reveal>
      </div>

      {similar.length > 0 && (
        <div className="mt-24">
          <Reveal><Eyebrow>Vous aimerez aussi</Eyebrow></Reveal>
          <Reveal delay={70}>
            <h2 className="mt-3 mb-6" style={{ fontFamily: "Anton", fontSize: 28, color: COLORS.ink }}>PRODUITS SIMILAIRES</h2>
          </Reveal>
          <RevealGroup className="grid grid-cols-2 md:grid-cols-4 gap-5" step={60} y={18}>
            {similar.map((p) => (
              <ProductCard key={p.id} product={p} brand={brands.find((b) => b.id === p.brandId)} onOpen={onOpen} />
            ))}
          </RevealGroup>
        </div>
      )}
    </section>
  );
}

/* ---------------- Brands page ---------------- */

function BrandsPage({ brands, products, onOpenBrand, selectedBrand, onOpen, go }) {
  const [brandSearch, setBrandSearch] = useState("");

  if (selectedBrand) {
    const brand = brands.find((b) => b.id === selectedBrand);
    const brandProducts = products.filter((p) => p.brandId === selectedBrand);
    return (
      <section className="max-w-7xl mx-auto px-5 md:px-8 py-12">
        <button onClick={() => onOpenBrand(null)} className="text-xs uppercase tracking-widest mb-6" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
          ← Toutes les marques
        </button>
        <Eyebrow>Marque</Eyebrow>
        <h1 className="mt-3 mb-2" style={{ fontFamily: "Anton", fontSize: "clamp(28px,5vw,44px)", color: COLORS.ink }}>{brand.name.toUpperCase()}</h1>
        <p className="max-w-lg text-sm mb-8" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>{brand.description}</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-5">
          {brandProducts.map((p) => (
            <ProductCard key={p.id} product={p} brand={brand} onOpen={onOpen} />
          ))}
        </div>
      </section>
    );
  }

  const filteredBrands = brands.filter((b) => b.name.toLowerCase().includes(brandSearch.trim().toLowerCase()));

  return (
    <section className="max-w-7xl mx-auto px-5 md:px-8 py-12">
      <Eyebrow>Univers Luxury Streetwear</Eyebrow>
      <h1 className="mt-3 mb-6" style={{ fontFamily: "Anton", fontSize: "clamp(28px,5vw,44px)", color: COLORS.ink }}>MARQUES</h1>
      <div className="relative max-w-sm mb-8">
        <input
          type="text"
          value={brandSearch}
          onChange={(e) => setBrandSearch(e.target.value)}
          placeholder="Rechercher une marque…"
          className="w-full px-4 py-2.5 text-sm rounded-sm"
          style={selectStyle}
        />
        {brandSearch && (
          <button
            onClick={() => setBrandSearch("")}
            aria-label="Effacer la recherche"
            className="absolute right-3 top-1/2 -translate-y-1/2 text-xs"
            style={{ color: COLORS.inkDim, fontFamily: "Inter" }}
          >
            ✕
          </button>
        )}
      </div>
      {filteredBrands.length === 0 ? (
        <p className="text-sm" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Aucune marque ne correspond à « {brandSearch} ».</p>
      ) : (
        <div className="grid md:grid-cols-2 gap-5">
          {filteredBrands.map((b) => {
            const count = products.filter((p) => p.brandId === b.id).length;
            return (
              <button key={b.id} onClick={() => onOpenBrand(b.id)} className="relative text-left p-6 rounded-sm border overflow-hidden group" style={{ borderColor: COLORS.line, background: COLORS.surface }}>
                <TagCorner />
                <div style={{ fontFamily: "Anton", fontSize: 26, color: COLORS.ink }}>{b.name.toUpperCase()}</div>
                <p className="text-sm mt-2 max-w-sm" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>{b.description}</p>
                <div className="text-xs mt-4 uppercase tracking-widest" style={{ color: COLORS.magenta, fontFamily: "Inter" }}>{count} produit{count > 1 ? "s" : ""} →</div>
              </button>
            );
          })}
        </div>
      )}
    </section>
  );
}

function StarRating({ rating, size = 14 }) {
  return (
    <div className="flex items-center gap-0.5" aria-label={`Note : ${rating} sur 5`}>
      {[1, 2, 3, 4, 5].map((i) => (
        <svg
          key={i}
          width={size}
          height={size}
          viewBox="0 0 20 20"
          fill={i <= rating ? COLORS.gold : "none"}
          stroke={i <= rating ? COLORS.gold : COLORS.line}
          strokeWidth="1"
        >
          <path d="M10 1.5l2.59 5.26 5.8.84-4.2 4.09.99 5.78L10 14.9l-5.18 2.57.99-5.78-4.2-4.09 5.8-.84L10 1.5z" />
        </svg>
      ))}
    </div>
  );
}

function ReviewCard({ review }) {
  const initials = (review.firstName || "?").trim().charAt(0).toUpperCase();
  return (
    <div
      className="review-card relative shrink-0 rounded-lg p-6 flex flex-col gap-4 transition-all duration-300"
      style={{
        width: "min(340px, 82vw)",
        background: "rgba(18,14,28,0.6)",
        border: `1px solid ${COLORS.line}`,
        backdropFilter: "blur(10px)",
        boxShadow: "0 20px 40px -24px rgba(0,0,0,0.6)",
      }}
    >
      <div
        aria-hidden
        className="absolute inset-0 rounded-lg pointer-events-none opacity-0 review-card-glow"
        style={{
          background: `radial-gradient(120% 100% at 15% 0%, rgba(139,47,232,0.16), transparent 60%)`,
        }}
      />
      <div className="relative flex items-center justify-between">
        <StarRating rating={review.rating} />
        {review.date && (
          <span className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
            {new Date(review.date).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" })}
          </span>
        )}
      </div>

      <p className="relative text-sm leading-relaxed" style={{ color: COLORS.ink, fontFamily: "Inter" }}>
        « {review.comment} »
      </p>

      <div className="relative flex items-center gap-3 mt-auto pt-2">
        {review.photoUrl ? (
          <img

/* Carrousel léger — sans dépendance externe : scroll horizontal natif (swipe tactile inclus)
   + flèches desktop + indicateurs. Perf : transform/scroll uniquement. */
function ReviewsCarousel({ reviews }) {
  const trackRef = useRef(null);
  const [activeIndex, setActiveIndex] = useState(0);

  const scrollByCard = (dir) => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector("[data-review-card]");
    const cardWidth = card ? card.getBoundingClientRect().width + 20 : 320;
    el.scrollBy({ left: dir * cardWidth, behavior: prefersReducedMotion ? "auto" : "smooth" });
  };

  const onScroll = () => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector("[data-review-card]");
    const cardWidth = card ? card.getBoundingClientRect().width + 20 : 320;
    const idx = Math.round(el.scrollLeft / cardWidth);
    setActiveIndex(Math.max(0, Math.min(reviews.length - 1, idx)));
  };

  const goToIndex = (i) => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector("[data-review-card]");
    const cardWidth = card ? card.getBoundingClientRect().width + 20 : 320;
    el.scrollTo({ left: i * cardWidth, behavior: prefersReducedMotion ? "auto" : "smooth" });
  };

  if (reviews.length === 0) return null;

  return (
    <div className="relative">
      {/* Flèches — desktop uniquement, cachées si peu d'avis */}
      {reviews.length > 3 && (
        <>
          <button
            onClick={() => scrollByCard(-1)}
            className="hidden md:flex absolute -left-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full items-center justify-center transition-transform hover:scale-110"
            style={{ background: COLORS.surface2, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            aria-label="Avis précédent"
          >
            ‹
          </button>
          <button
            onClick={() => scrollByCard(1)}
            className="hidden md:flex absolute -right-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full items-center justify-center transition-transform hover:scale-110"
            style={{ background: COLORS.surface2, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            aria-label="Avis suivant"
          >
            ›
          </button>
        </>
      )}

      <div
        ref={trackRef}
        onScroll={onScroll}
        className="flex gap-5 overflow-x-auto pb-2 snap-x snap-mandatory reviews-track"
        style={{ scrollbarWidth: "none" }}
      >
        {reviews.map((r) => (
          <div key={r.id} data-review-card className="snap-start">
            <ReviewCard review={r} />
          </div>
        ))}
      </div>

      {/* Indicateurs */}
      {reviews.length > 1 && (
        <div className="flex items-center justify-center gap-2 mt-5">
          {reviews.map((r, i) => (
            <button
              key={r.id}
              onClick={() => goToIndex(i)}
              aria-label={`Aller à l'avis ${i + 1}`}
              className="rounded-full transition-all duration-300"
              style={{
                width: i === activeIndex ? 20 : 6,
                height: 6,
                background: i === activeIndex ? COLORS.magenta : COLORS.line,
                boxShadow: i === activeIndex ? "0 0 8px rgba(255,46,196,0.6)" : "none",
              }}
            />
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Admin login (Supabase Auth) ---------------- */

function AdminLogin({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    try {
      const client = await getSupabaseAuthClient();
      const { data, error: signInError } = await client.auth.signInWithPassword({ email, password });
      if (signInError) {
        throw new Error(signInError.message || "Authentication error");
      }
      if (!data || !data.user) {
        throw new Error("Authentication error");
      }
      if (data.user.id !== ADMIN_USER_ID) {
        await client.auth.signOut();
        throw new Error("Unauthorized : ce compte n'est pas administrateur.");
      }
      onSignedIn();
    } catch (err) {
      setError(err && err.message ? err.message : String(err));
    } finally {
      setLoading(false);
    }
  };

  return (
    <section className="max-w-sm mx-auto px-5 py-20">
      <Eyebrow>Accès restreint</Eyebrow>
      <h1 className="mt-3 mb-6" style={{ fontFamily: "Anton", fontSize: 32, color: COLORS.ink }}>ADMIN — CONNEXION</h1>
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Email</label>
          <input
            required
            type="email"
            autoComplete="username"
            className="w-full px-3 py-2 text-sm rounded-sm"
            style={selectStyle}
            value={email}
            onChange={(e) => setEmail(e.target.value)}
          />
        </div>
        <div>
          <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Mot de passe</label>
          <input
            required
            type="password"
            autoComplete="current-password"
            className="w-full px-3 py-2 text-sm rounded-sm"
            style={selectStyle}
            value={password}
            onChange={(e) => setPassword(e.target.value)}
          />
        </div>
        {error && (
          <div className="text-xs px-3 py-2 rounded-sm" style={{ background: COLORS.surface2, color: "#FF5C7A", fontFamily: "Inter" }}>
            {error}
          </div>
        )}
        <SolidButton className="w-full">{loading ? "Connexion…" : "Se connecter"}</SolidButton>
      </form>
    </section>
  );
}

function AdminDashboard({ products, setProducts, brands, setBrands, categories, setCategories, saveStatus, onSignOut, onReloadProducts, productsLoading, productsError, onReloadBrands, brandsLoading, brandsError, reviews, setReviews, onReloadReviews, reviewsLoading, reviewsError, videoTestimonials, setVideoTestimonials, onReloadVideoTestimonials, videoTestimonialsLoading, videoTestimonialsError }) {
  const [tab, setTab] = useState("products");
  const [editing, setEditing] = useState(null);
  const [editingBrand, setEditingBrand] = useState(null);
  const [editingCategory, setEditingCategory] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [editingReview, setEditingReview] = useState(null);
  const [editingVideoTestimonial, setEditingVideoTestimonial] = useState(null);

  const fileInputRef = useRef(null);
  const [uploadStatus, setUploadStatus] = useState("");
  const [debugLog, setDebugLog] = useState([]);
  const [dragIndex, setDragIndex] = useState(null);
  const [isDraggingOverDrop, setIsDraggingOverDrop] = useState(false);

  // ----- Upload de vidéos d'avis (bucket "customer-reviews") -----
  const videoFileInputRef = useRef(null);
  const [videoUploadStatus, setVideoUploadStatus] = useState("");
  const [videoDebugLog, setVideoDebugLog] = useState([]);
  const [isDraggingOverVideoDrop, setIsDraggingOverVideoDrop] = useState(false);

  const tabs = [
    ["products", "Produits"],
    ["brands", "Marques"],
    ["categories", "Catégories"],
    ["reviews", "Avis"],
  ];

  const [saveError, setSaveError] = useState("");
  const [savingProduct, setSavingProduct] = useState(false);
  const [deleteError, setDeleteError] = useState("");

  const [saveErrorBrand, setSaveErrorBrand] = useState("");
  const [savingBrand, setSavingBrand] = useState(false);
  const [deleteErrorBrand, setDeleteErrorBrand] = useState("");
  const [confirmDeleteBrand, setConfirmDeleteBrand] = useState(null);

  const [saveErrorReview, setSaveErrorReview] = useState("");
  const [savingReview, setSavingReview] = useState(false);
  const [deleteErrorReview, setDeleteErrorReview] = useState("");
  const [confirmDeleteReview, setConfirmDeleteReview] = useState(null);

  const [saveErrorVideo, setSaveErrorVideo] = useState("");
  const [savingVideo, setSavingVideo] = useState(false);
  const [deleteErrorVideo, setDeleteErrorVideo] = useState("");
  const [confirmDeleteVideo, setConfirmDeleteVideo] = useState(null);

  const saveProduct = async () => {
    if (!editing.name || !editing.brandId || !editing.categoryId || !editing.reference) return;
    setSaveError("");
    try {
      await requireAdmin();
    } catch (err) {
      setSaveError(err && err.message ? err.message : String(err));
      return;
    }

    setSavingProduct(true);
    try {
      const client = await getSupabaseAuthClient();
      const row = productToRow(editing);
      if (editing.id) {
        const { error } = await client.from("products").update(row).eq("id", editing.id);
        if (error) throw error;
      } else {
        const { error } = await client.from("products").insert(row);
        if (error) throw error;
      }
    } catch (err) {
      console.error("Enregistrement produit échoué:", err);
      setSaveError(
        "Impossible d'enregistrer le produit. Erreur Supabase : " +
          (err && err.message ? err.message : String(err))
      );
      setSavingProduct(false);
      return; // le formulaire "editing" est conservé, rien n'est perdu
    }

    if (onReloadProducts) {
      await onReloadProducts();
    }
    setSavingProduct(false);
    setEditing(null);
  };

  const deleteProduct = async (id) => {
    setDeleteError("");
    try {
      await requireAdmin();
      const client = await getSupabaseAuthClient();
      const { error } = await client.from("products").delete().eq("id", id);
      if (error) throw error;
      if (onReloadProducts) {
        await onReloadProducts();
      }
      setConfirmDelete(null);
    } catch (err) {
      console.error("Suppression produit échouée:", err && err.message ? err.message : err);
      setDeleteError(
        "Impossible de supprimer le produit. Erreur Supabase : " +
          (err && err.message ? err.message : String(err))
      );
      // on laisse confirmDelete ouvert pour que l'admin voie l'erreur
    }
  };

  const openFilePicker = () => fileInputRef.current?.click();

  const handleFilesSelected = async (fileList) => {
    const files = Array.from(fileList || []);
    if (files.length === 0) return;

    setUploadStatus("uploading");
    setDebugLog([]);

    let accessToken;
    try {
      ({ accessToken } = await requireAdmin());
    } catch (err) {
      const detail = err && err.message ? err.message : String(err);
      setDebugLog([{ fileName: "—", step: "connexion", ok: false, detail }]);
      setUploadStatus("done");
      return;
    }

    const newUrls = [];
    const fileLogs = [];

    await Promise.allSettled(
      files.map(async (file) => {
        const fileName = file.name || "(photo sans nom)";
        const onStep = (step, ok, detail) => {
          fileLogs.push({ fileName, step, ok, detail });
          setDebugLog((prev) => [...prev, { fileName, step, ok, detail }]);
        };
        try {
          const uploaded = await uploadToSupabase(file, accessToken, onStep);
          newUrls.push(uploaded.publicUrl);
        } catch (err) {
          if (!fileLogs.some((l) => l.fileName === fileName && !l.ok)) {
            const detail = err && err.message ? err.message : String(err);
            fileLogs.push({ fileName, step: "upload", ok: false, detail });
            setDebugLog((prev) => [...prev, { fileName, step: "upload", ok: false, detail }]);
          }
        }
      })
    );

    if (newUrls.length > 0) {
      setEditing((e) => ({ ...e, images: [...e.images, ...newUrls] }));
    }
    setUploadStatus("done");
  };

  const onFileInputChange = (e) => {
    handleFilesSelected(e.target.files);
    e.target.value = "";
  };

  const onDropZoneDragOver = (e) => { e.preventDefault(); setIsDraggingOverDrop(true); };
  const onDropZoneDragLeave = () => setIsDraggingOverDrop(false);
  const onDropZoneDrop = (e) => {
    e.preventDefault();
    setIsDraggingOverDrop(false);
    handleFilesSelected(e.dataTransfer.files);
  };

  const removeImage = async (idx) => {
    const url = editing.images[idx];

        if (error) throw error;

  const handleVideoFileSelected = async (fileList) => {
    const files = Array.from(fileList || []);
    const file = files[0]; // un seul fichier vidéo par avis
    if (!file) return;

    setVideoUploadStatus("uploading");
    setVideoDebugLog([]);

    let accessToken;
    try {
      ({ accessToken } = await requireAdmin());
    } catch (err) {
      const detail = err && err.message ? err.message : String(err);
      setVideoDebugLog([{ step: "connexion", ok: false, detail }]);
      setVideoUploadStatus("done");
      return;
    }

    const fileName = file.name || "(vidéo sans nom)";
    const onStep = (step, ok, detail) => {
      setVideoDebugLog((prev) => [...prev, { fileName, step, ok, detail }]);
    };

    try {
      // Si une vidéo était déjà présente sur cet avis (remplacement), on la
      // supprime du Storage pour ne pas laisser de fichier orphelin.
      if (editingVideoTestimonial.storagePath) {
        await deleteVideoFromSupabase(editingVideoTestimonial.storagePath, accessToken);
      }
      const uploaded = await uploadVideoToSupabase(file, accessToken, onStep);
      setEditingVideoTestimonial((v) => ({
        ...v,
        videoUrl: uploaded.publicUrl,
        storagePath: uploaded.path,
      }));
    } catch (err) {
      // L'erreur est déjà tracée dans le journal via onStep ; rien de plus à faire.
    }
    setVideoUploadStatus("done");
  };

const WHATSAPP_NUMBER = "33607672748"; // 06 07 67 27 48 au format international, sans + ni espaces (requis par wa.me)

function whatsappLink(message) {
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
}

function buildWhatsAppQuestionMessage() {
  return "Bonjour LUXURY STREETWEAR, j'aimerais avoir des informations concernant vos produits.";
}

/* Construit le message de commande uniquement à partir des données réellement
   présentes sur chaque article du panier — aucune information n'est inventée. */
function buildWhatsAppOrderMessage(cart) {
  const lines = ["Bonjour LUXURY STREETWEAR,", "", "Je souhaite commander les articles suivants :", ""];
  cart.forEach((item, i) => {
    const titleParts = [item.name];
    lines.push(`${i + 1}. ${item.name}${item.brandName ? " — " + item.brandName : ""}`);
    if (item.reference) lines.push(`   Référence : ${item.reference}`);
    if (item.size) lines.push(`   ${item.sizeLabel || "Taille"} : ${item.size}`);
    if (item.color) lines.push(`   Couleur : ${item.color}`);
    lines.push(`   Quantité : ${item.quantity}`);
    if (item.price != null) lines.push(`   Prix : ${item.price} €`);
    lines.push("");
  });
  lines.push(
    "Livraison partout en France : jusqu'à 2 semaines pour les articles sur commande. Produits en stock : livraison sous 72h. Remise en main propre possible à Grenoble et dans ses environs."
  );
  lines.push("");
  lines.push("Je souhaite connaître la disponibilité et les modalités de livraison.");
  lines.push("");
  lines.push("Merci.");
  return lines.join("\n");
}

  const [videoTestimonials, setVideoTestimonials] = useState([]);

  const [videoTestimonialsError, setVideoTestimonialsError] = useState("");
