/* ---------------- Admin login (Supabase Auth) ---------------- */

function AdminLogin({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    try {
      const client = await getSupabaseAuthClient();
      const { data, error: signInError } = await client.auth.signInWithPassword({ email, password });
      if (signInError) {
        throw new Error(signInError.message || "Authentication error");
      }
      if (!data || !data.user) {
        throw new Error("Authentication error");
      }
      if (data.user.id !== ADMIN_USER_ID) {
        await client.auth.signOut();
        throw new Error("Unauthorized : ce compte n'est pas administrateur.");
      }
      onSignedIn();
    } catch (err) {
      setError(err && err.message ? err.message : String(err));
    } finally {
      setLoading(false);
    }
  };

  return (
    <section className="max-w-sm mx-auto px-5 py-20">
      <Eyebrow>Accès restreint</Eyebrow>
      <h1 className="mt-3 mb-6" style={{ fontFamily: "Anton", fontSize: 32, color: COLORS.ink }}>ADMIN — CONNEXION</h1>
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Email</label>
          <input
            required
            type="email"
            autoComplete="username"
            className="w-full px-3 py-2 text-sm rounded-sm"
            style={selectStyle}
            value={email}
            onChange={(e) => setEmail(e.target.value)}
          />
        </div>
        <div>
          <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Mot de passe</label>
          <input
            required
            type="password"
            autoComplete="current-password"
            className="w-full px-3 py-2 text-sm rounded-sm"
            style={selectStyle}
            value={password}
            onChange={(e) => setPassword(e.target.value)}
          />
        </div>
        {error && (
          <div className="text-xs px-3 py-2 rounded-sm" style={{ background: COLORS.surface2, color: "#FF5C7A", fontFamily: "Inter" }}>
            {error}
          </div>
        )}
        <SolidButton className="w-full">{loading ? "Connexion…" : "Se connecter"}</SolidButton>
      </form>
    </section>
  );
}

function AdminDashboard({ products, setProducts, brands, setBrands, categories, setCategories, saveStatus, onSignOut, onReloadProducts, productsLoading, productsError, onReloadBrands, brandsLoading, brandsError, reviews, setReviews, onReloadReviews, reviewsLoading, reviewsError, videoTestimonials, setVideoTestimonials, onReloadVideoTestimonials, videoTestimonialsLoading, videoTestimonialsError }) {

  // ----- Upload de vidéos d'avis (bucket "customer-reviews") -----
  const videoFileInputRef = useRef(null);
  const [videoUploadStatus, setVideoUploadStatus] = useState("");
  const [videoDebugLog, setVideoDebugLog] = useState([]);

  // ----- Upload de la photo "article commandé" d'un avis client (bucket "product-images") -----
  const reviewPhotoInputRef = useRef(null);
  const [reviewPhotoUploadStatus, setReviewPhotoUploadStatus] = useState("");
  const [reviewPhotoUploadError, setReviewPhotoUploadError] = useState("");

  const openReviewPhotoPicker = () => reviewPhotoInputRef.current?.click();

  const handleReviewProductPhotoSelected = async (fileList) => {
    const file = (fileList || [])[0];
    if (!file) return;
    setReviewPhotoUploadStatus("uploading");
    setReviewPhotoUploadError("");
    try {

  };

  const onReviewPhotoInputChange = (e) => {

  };

  const removeReviewProductPhoto = async () => {
    const url = editingReview && editingReview.productPhotoUrl;
    setEditingReview((r) => ({ ...r, productPhotoUrl: "" }));
    if (!url) return;
    try {
      const { accessToken } = await requireAdmin();
      await deleteFromSupabase(url, accessToken);
    } catch (err) {
      console.error("Suppression refusée :", err && err.message ? err.message : err);
    }
  };

  const tabs = [
    ["products", "Produits"],
    ["brands", "Marques"],
    ["categories", "Catégories"],
    ["reviews", "Avis"],
  ];

  const [saveError, setSaveError] = useState("");
  const [savingProduct, setSavingProduct] = useState(false);
  const [deleteError, setDeleteError] = useState("");

  const [saveErrorBrand, setSaveErrorBrand] = useState("");
  const [savingBrand, setSavingBrand] = useState(false);
  const [deleteErrorBrand, setDeleteErrorBrand] = useState("");
  const [confirmDeleteBrand, setConfirmDeleteBrand] = useState(null);

  const [saveErrorReview, setSaveErrorReview] = useState("");
  const [savingReview, setSavingReview] = useState(false);
  const [deleteErrorReview, setDeleteErrorReview] = useState("");
  const [confirmDeleteReview, setConfirmDeleteReview] = useState(null);

  const [saveErrorVideo, setSaveErrorVideo] = useState("");
  const [savingVideo, setSavingVideo] = useState(false);
  const [deleteErrorVideo, setDeleteErrorVideo] = useState("");
  const [confirmDeleteVideo, setConfirmDeleteVideo] = useState(null);

  const saveProduct = async () => {
    if (!editing.name || !editing.brandId || !editing.categoryId || !editing.reference) return;
    // Genre / Sous-catégorie obligatoires uniquement pour les catégories qui les proposent
    // (Chaussures, Vêtements, Sacs, Casquettes) — Accessoires et Montres n'en ont pas besoin.
    if (gendersForCategory(editing.categoryId).length > 0 && !editing.gender) {
      setSaveError("Veuillez choisir un genre (Homme / Femme) pour cette catégorie.");
      return;
    }
    if (CATALOG_TREE[editing.categoryId] && !editing.subcategory) {
      setSaveError("Veuillez choisir une sous-catégorie pour ce produit.");
      return;
    }
    if (!editing.availability) {
      setSaveError("Veuillez choisir la disponibilité de ce produit (Disponible / Sur commande / Indisponible).");
      return;
    }
    setSaveError("");
    try {
      await requireAdmin();
    } catch (err) {
      setSaveError(err && err.message ? err.message : String(err));
      return;
    }

    setSavingProduct(true);
    try {
      const client = await getSupabaseAuthClient();
      const row = productToRow(editing);
      if (editing.id) {
        const { error } = await client.from("products").update(row).eq("id", editing.id);
        if (error) throw error;
      } else {
        const { error } = await client.from("products").insert(row);
        if (error) throw error;
      }
    } catch (err) {
      console.error("Enregistrement produit échoué:", err);
      setSaveError(
        "Impossible d'enregistrer le produit. Erreur Supabase : " +
          (err && err.message ? err.message : String(err))

      setSavingProduct(false);
      return; // le formulaire "editing" est conservé, rien n'est perdu

    if (onReloadProducts) {
      await onReloadProducts();
    }
    setSavingProduct(false);
    setEditing(null);
  };

  const deleteProduct = async (id) => {
    setDeleteError("");
    try {
      await requireAdmin();
      const client = await getSupabaseAuthClient();
      const { error } = await client.from("products").delete().eq("id", id);
      if (error) throw error;
      if (onReloadProducts) {
        await onReloadProducts();
      }
      setConfirmDelete(null);

      console.error("Suppression produit échouée:", err && err.message ? err.message : err);

    }
  };

  const openFilePicker = () => fileInputRef.current?.click();

  const handleFilesSelected = async (fileList) => {
    const files = Array.from(fileList || []);
    if (files.length === 0) return;

    setUploadStatus("uploading");
    setDebugLog([]);

    let accessToken;
    try {
      ({ accessToken } = await requireAdmin());
    } catch (err) {
      const detail = err && err.message ? err.message : String(err);
      setDebugLog([{ fileName: "—", step: "connexion", ok: false, detail }]);
      setUploadStatus("done");
      return;
    }

    const newUrls = [];
    const fileLogs = [];

    await Promise.allSettled(
      files.map(async (file) => {
        const fileName = file.name || "(photo sans nom)";
        const onStep = (step, ok, detail) => {
          fileLogs.push({ fileName, step, ok, detail });
          setDebugLog((prev) => [...prev, { fileName, step, ok, detail }]);
        };
        try {
          const uploaded = await uploadToSupabase(file, accessToken, onStep);
          newUrls.push(uploaded.publicUrl);
        } catch (err) {
          if (!fileLogs.some((l) => l.fileName === fileName && !l.ok)) {
            const detail = err && err.message ? err.message : String(err);
            fileLogs.push({ fileName, step: "upload", ok: false, detail });
            setDebugLog((prev) => [...prev, { fileName, step: "upload", ok: false, detail }]);
          }
        }
      })
    );

    if (newUrls.length > 0) {
      setEditing((e) => ({ ...e, images: [...e.images, ...newUrls] }));
    }
    setUploadStatus("done");
  };

  const onFileInputChange = (e) => {
    handleFilesSelected(e.target.files);
    e.target.value = "";
  };

  const onDropZoneDragOver = (e) => { e.preventDefault(); setIsDraggingOverDrop(true); };
  const onDropZoneDragLeave = () => setIsDraggingOverDrop(false);

    e.preventDefault();
    setIsDraggingOverDrop(false);
    handleFilesSelected(e.dataTransfer.files);
  };

  const removeImage = async (idx) => {
    const url = editing.images[idx];

    try {
      const { accessToken } = await requireAdmin();
      await deleteFromSupabase(url, accessToken);
    } catch (err) {
      console.error("Suppression refusée :", err && err.message ? err.message : err);
    }
  };

  const setPrimaryImage = (idx) => {
    setEditing((e) => {
      if (idx === 0) return e;
      const images = [...e.images];
      const [chosen] = images.splice(idx, 1);
      images.unshift(chosen);
      return { ...e, images };
    });
  };

  const onImageDragStart = (idx) => setDragIndex(idx);
  const onImageDragOver = (e) => e.preventDefault();
  const onImageDrop = (idx) => {
    setEditing((e) => {
      if (dragIndex === null || dragIndex === idx) return e;
      const images = [...e.images];
      const [moved] = images.splice(dragIndex, 1);
      images.splice(idx, 0, moved);
      return { ...e, images };
    });
    setDragIndex(null);
  };

  const toggleListValue = (field, value) => {

      const list = e[field];
      return { ...e, [field]: list.includes(value) ? list.filter((v) => v !== value) : [...list, value] };

  const saveBrand = async () => {
    if (!editingBrand.name) return;
    setSaveErrorBrand("");
    try {
      await requireAdmin();
    } catch (err) {
      setSaveErrorBrand(err && err.message ? err.message : String(err));

    setVideoUploadStatus("uploading");
    setVideoDebugLog([]);

    let accessToken;
    try {
      ({ accessToken } = await requireAdmin());
    } catch (err) {
      const detail = err && err.message ? err.message : String(err);
      setVideoDebugLog([{ step: "connexion", ok: false, detail }]);
      setVideoUploadStatus("done");
      return;
    }

    const fileName = file.name || "(vidéo sans nom)";
    const onStep = (step, ok, detail) => {
      setVideoDebugLog((prev) => [...prev, { fileName, step, ok, detail }]);
    };

    try {
      // Si une vidéo était déjà présente sur cet avis (remplacement), on la
      // supprime du Storage pour ne pas laisser de fichier orphelin.
      if (editingVideoTestimonial.storagePath) {
        await deleteVideoFromSupabase(editingVideoTestimonial.storagePath, accessToken);
      }
      const uploaded = await uploadVideoToSupabase(file, accessToken, onStep);
      setEditingVideoTestimonial((v) => ({
        ...v,
        videoUrl: uploaded.publicUrl,
        storagePath: uploaded.path,
      }));
    } catch (err) {
      // L'erreur est déjà tracée dans le journal via onStep ; rien de plus à faire.
    }
    setVideoUploadStatus("done");
  };

function whatsappLink(message) {

/* Construit le message de commande uniquement à partir des données réellement
   présentes sur chaque article du panier — aucune information n'est inventée. */
function buildWhatsAppOrderMessage(cart) {
  const lines = ["Bonjour KING OUTLET,", "", "Je souhaite commander les articles suivants :", ""];
  cart.forEach((item, i) => {
    const titleParts = [item.name];
    lines.push(`${i + 1}. ${item.name}${item.brandName ? " — " + item.brandName : ""}`);
    if (item.reference) lines.push(`   Référence : ${item.reference}`);
    if (item.size) lines.push(`   ${item.sizeLabel || "Taille"} : ${item.size}`);
    if (item.color) lines.push(`   Couleur : ${item.color}`);
    lines.push(`   Quantité : ${item.quantity}`);
    if (item.price != null) lines.push(`   Prix : ${item.price} €`);
    lines.push("");
  });
  lines.push(
    "Livraison partout en France. Produits en stock : expédition/livraison sous 48 à 72h. Produits sur commande : délai de livraison estimé à environ 2 semaines. Livraison Rhône-Alpes disponible pour toute commande d'un montant minimum de 1 000 €."
  );
  lines.push("");
  lines.push("Je souhaite connaître la disponibilité et les modalités de livraison.");
  lines.push("");
  lines.push("Merci.");
  return lines.join("\n");
}

/* Bouton "remonter en haut" — filet de sécurité en complément de la navbar
   qui réapparaît au scroll vers le haut : si jamais un utilisateur reste
   bloqué avec la navbar cachée (scroll très rapide, geste ambigu…), ce
   bouton reste toujours disponible pour remonter en un tap/clic. Positionné
   à gauche pour ne jamais chevaucher le bouton WhatsApp (à droite). */
/* Barre de progression de scroll — immersive, fixée en haut de toutes les pages */
function ScrollProgressBar() {
  const [pct, setPct] = useState(0);

  useEffect(() => {
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const doc = document.documentElement;
        const scrollable = doc.scrollHeight - doc.clientHeight;
        setPct(scrollable > 0 ? Math.min(100, Math.max(0, (window.scrollY / scrollable) * 100)) : 0);
        raf = null;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    onScroll();
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return <div className="scroll-progress-bar" style={{ width: `${pct}%` }} aria-hidden />;
}

function ScrollToTopButton() {
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        setVisible((window.scrollY || 0) > 420);
        raf = null;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => {
      window.removeEventListener("scroll", onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <button
      onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
      aria-label="Remonter en haut de la page"
      className="fixed z-40 flex items-center justify-center rounded-full transition-all duration-250 hover:scale-110 active:scale-95"

}

                        <div className="text-xs font-semibold" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{(item.price * item.quantity).toFixed(2)} €</div>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {cart.length > 0 && (
          <div className="px-5 py-5 border-t" style={{ borderColor: COLORS.line }}>
            {hasPrices && (
              <div className="flex items-center justify-between mb-4">
                <span className="text-xs uppercase tracking-widest" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Sous-total</span>
                <span className="text-base font-semibold" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{subtotal.toFixed(2)} €</span>
              </div>
            )}
            <a
              href={whatsappLink(buildWhatsAppOrderMessage(cart))}
              target="_blank"
              rel="noopener noreferrer"
              className="w-full flex items-center justify-center gap-2.5 py-3.5 rounded-sm text-sm font-semibold uppercase tracking-wider transition-transform duration-150 hover:scale-[1.02]"
              style={{ background: "linear-gradient(160deg, #29e074, #1fb85c)", color: "#08110B", fontFamily: "Inter" }}
            >
              <WhatsAppGlyph size={19} color="#08110B" />
              Commander via WhatsApp
            </a>
            <button
              onClick={() => { onClose(); go("catalog"); }}
              className="w-full mt-3 text-xs uppercase tracking-widest"
              style={{ color: COLORS.inkDim, fontFamily: "Inter" }}
            >
              Continuer mes achats
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

const STORAGE_KEY = "king-outlet-catalog-data";


/* ---------------- OrderInfo (Comment Passer Commande) ---------------- */

function App() {
  const [route, setRoute] = useState("home");
  // Supabase est la source de vérité pour les produits ET les marques :
  // on démarre à vide (pas de INITIAL_PRODUCTS / BRANDS ici) et on affiche
  // un état de chargement le temps du premier SELECT. INITIAL_PRODUCTS et
  // BRANDS sont conservés plus haut dans le fichier au cas où ils
  // serviraient ailleurs, mais ne sont plus utilisés comme donnée de repli.
  const [products, setProducts] = useState([]);
  const [productsLoading, setProductsLoading] = useState(true);
  const [productsError, setProductsError] = useState("");
  const [brands, setBrands] = useState([]);
  const [brandsLoading, setBrandsLoading] = useState(true);
  const [brandsError, setBrandsError] = useState("");
  const [categories, setCategories] = useState(CATEGORIES);
  // Avis clients — source de vérité = Supabase (table "reviews"), même
  // logique que products/brands : on démarre à vide et on charge au montage.
  const [reviews, setReviews] = useState([]);
  const [reviewsLoading, setReviewsLoading] = useState(true);
  const [reviewsError, setReviewsError] = useState("");
  // Avis vidéo — source de vérité = Supabase (table "video_testimonials"),
  // même logique que products/brands/reviews : on démarre à vide et on
  // charge au montage.
  const [videoTestimonials, setVideoTestimonials] = useState([]);
  const [videoTestimonialsLoading, setVideoTestimonialsLoading] = useState(true);
  const [videoTestimonialsError, setVideoTestimonialsError] = useState("");
  const [selectedProductId, setSelectedProductId] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState("all");
  const [brandFilter, setBrandFilter] = useState("all");
  const [genderFilter, setGenderFilter] = useState("all");
  const [subcategoryFilter, setSubcategoryFilter] = useState("all");
  const [selectedBrandId, setSelectedBrandId] = useState(null);

  /* ----- Panier WhatsApp — minimal, persistant en localStorage ----- */
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [cartLoaded, setCartLoaded] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(CART_STORAGE_KEY);
      if (raw) setCart(JSON.parse(raw));
    } catch (err) {}
    setCartLoaded(true);
  }, []);

  useEffect(() => {
    if (!cartLoaded) return;
    try {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    } catch (err) {}
  }, [cart, cartLoaded]);

  const addToCart = (item) => {
    setCart((prev) => {
      const key = `${item.productId}__${item.size || ""}__${item.color || ""}`;
      const existing = prev.find((it) => `${it.productId}__${it.size || ""}__${it.color || ""}` === key);
      if (existing) {
        return prev.map((it) => (it === existing ? { ...it, quantity: it.quantity + item.quantity } : it));
      }
      return [...prev, { ...item, cartItemId: key + "__" + Date.now() }];
    });
    setCartOpen(true);
  };
  const updateCartQty = (cartItemId, qty) => {
    if (qty < 1) return;
    setCart((prev) => prev.map((it) => (it.cartItemId === cartItemId ? { ...it, quantity: qty } : it)));
  };
  const removeCartItem = (cartItemId) => {
    setCart((prev) => prev.filter((it) => it.cartItemId !== cartItemId));
  };
  const cartCount = cart.reduce((n, it) => n + it.quantity, 0);

  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("");

  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const isAdmin = !!(session && session.user && session.user.id === ADMIN_USER_ID);

  useEffect(() => {
    let unsubscribe = null;
    let cancelled = false;
    (async () => {
      try {
        const client = await getSupabaseAuthClient();
        const { data } = await client.auth.getSession();
        if (!cancelled) setSession(data.session || null);
        const { data: sub } = client.auth.onAuthStateChange((_event, newSession) => {
          setSession(newSession || null);
        });
        unsubscribe = () => sub.subscription.unsubscribe();
      } catch (err) {
        console.error("Supabase Auth indisponible:", err);
      } finally {
        if (!cancelled) setAuthChecked(true);
      }
    })();
    return () => {
      cancelled = true;
      if (unsubscribe) unsubscribe();
    };
  }, []);

  const signOutAdmin = async () => {
    try {
      const client = await getSupabaseAuthClient();
      await client.auth.signOut();
    } catch (err) {
      console.error("Déconnexion échouée:", err);
    }
    setSession(null);
  };

  /* ----- Produits : source de vérité = Supabase (table "products") -----
     Important : on écrase TOUJOURS products avec le résultat du SELECT,
     même si le tableau est vide. Aucun repli automatique sur
     INITIAL_PRODUCTS — si Supabase renvoie 0 ligne, le catalogue doit
     réellement afficher 0 produit. En cas d'échec réseau/RLS, on NE
     VIDE PAS le catalogue actuellement affiché (pour éviter qu'une
     coupure réseau transitoire fasse disparaître les produits à l'écran) ;
     à la place, l'erreur est stockée dans productsError et affichée. */
  const reloadProducts = async () => {
    setProductsError("");
    try {
      const fresh = await loadProductsFromSupabase();
      setProducts(fresh);
    } catch (err) {
      console.error("Chargement des produits depuis Supabase échoué:", err);
      setProductsError(
        "Impossible de charger les produits depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  /* ----- Marques : source de vérité = Supabase (table "brands") -----
     Même logique que pour les produits : le tableau "brands" est
     entièrement piloté par Supabase. En cas d'échec réseau/RLS, on
     conserve la liste de marques actuellement affichée et on stocke
     l'erreur dans brandsError plutôt que de vider la liste. */
  const reloadBrands = async () => {
    setBrandsError("");
    try {
      const fresh = await loadBrandsFromSupabase();
      setBrands(fresh);
    } catch (err) {
      console.error("Chargement des marques depuis Supabase échoué:", err);
      setBrandsError(
        "Impossible de charger les marques depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  /* ----- Avis clients : source de vérité = Supabase (table "reviews") -----
     Même logique que pour les marques : en cas d'échec réseau/RLS, on
     conserve la liste actuellement affichée et on stocke l'erreur dans
     reviewsError plutôt que de vider la liste. */
  const reloadReviews = async () => {
    setReviewsError("");
    try {
      const fresh = await loadReviewsFromSupabase();
      setReviews(fresh);
    } catch (err) {
      console.error("Chargement des avis depuis Supabase échoué:", err);
      setReviewsError(
        "Impossible de charger les avis depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  /* ----- Avis vidéo : source de vérité = Supabase (table "video_testimonials") -----
     Même logique que pour les avis clients : en cas d'échec réseau/RLS, on
     conserve la liste actuellement affichée et on stocke l'erreur dans
     videoTestimonialsError plutôt que de vider la liste. */
  const reloadVideoTestimonials = async () => {
    setVideoTestimonialsError("");
    try {
      const fresh = await loadVideoTestimonialsFromSupabase();
      setVideoTestimonials(fresh);
    } catch (err) {
      console.error("Chargement des avis vidéo depuis Supabase échoué:", err);
      setVideoTestimonialsError(
        "Impossible de charger les avis vidéo depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  useEffect(() => {
    reloadProducts().finally(() => { setProductsLoading(false); setLoaded(true); });
    reloadBrands().finally(() => { setBrandsLoading(false); });
    reloadReviews().finally(() => { setReviewsLoading(false); });
    reloadVideoTestimonials().finally(() => { setVideoTestimonialsLoading(false); });
  }, []);

  /* ----- Catégories : encore en localStorage pour l'instant -----
     Les marques ne sont plus lues/écrites ici : elles viennent
     exclusivement de Supabase (table "brands", voir reloadBrands
     ci-dessus). Seules les catégories restent gérées en local. */
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (Array.isArray(data.categories)) setCategories(data.categories);
      }
    } catch (err) {
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveStatus("enregistrement");
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ categories }));
      setSaveStatus("enregistré");
    } catch (err) {
      setSaveStatus("erreur");
    }
  }, [categories, loaded]);

  const go = (r) => {
    setRoute(r);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const openProduct = (id) => {
    setSelectedProductId(id);
    setRoute("product");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const selectedProduct = products.find((p) => p.id === selectedProductId);
  const selectedBrand = selectedProduct ? brands.find((b) => b.id === selectedProduct.brandId) : null;

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh" }}>
      <style>{FONT_IMPORT}{`

        ::selection { background: ${COLORS.magenta}; color: #0F0806; }

        @keyframes menuPanelIn {

        .mobile-menu-panel { animation: menuPanelIn .22s cubic-bezier(0.16,1,0.3,1); }
        .mobile-cat-card, .mobile-brand-card {
          transition: border-color .18s ease, background-color .18s ease, transform .18s ease;

        @media (prefers-reduced-motion: reduce) {

        }
      `}</style>

      <ScrollProgressBar />

      <Header
        route={route}
        go={go}
        categories={categories}
        brands={brands}
        products={products}
        setCategoryFilter={setCategoryFilter}
        setBrandFilter={setBrandFilter}
        setGenderFilter={setGenderFilter}
        setSubcategoryFilter={setSubcategoryFilter}
        setSelectedBrandId={setSelectedBrandId}
        cartCount={cartCount}
        onOpenCart={() => setCartOpen(true)}
      />

      {route === "home" && (
        <>
          <Hero go={go} />
          <OrderInfo />
          <CategoryGrid go={go} setCategoryFilter={setCategoryFilter} setGenderFilter={setGenderFilter} setSubcategoryFilter={setSubcategoryFilter} />
          <section className="max-w-7xl mx-auto px-5 md:px-8 pb-16">
            <div className="flex items-end justify-between mb-6">
              <Reveal>
                <div>

              <GhostButton onClick={() => go("catalog-new")}>Voir tout</GhostButton>

            </RevealGroup>
          </section>
          <section className="max-w-7xl mx-auto px-5 md:px-8 pb-20">
            <div className="flex items-end justify-between mb-6">
              <Reveal>
                <div>
                  <Eyebrow>Sélection</Eyebrow>

        <Catalog products={products} brands={brands} initialCategory={categoryFilter} initialBrand={brandFilter} initialGender={genderFilter} initialSubcategory={subcategoryFilter} forceNew={false} onOpen={openProduct} go={go} />

      )}

      {route === "admin" && authChecked && !isAdmin && (
        <AdminLogin onSignedIn={() => { /* onAuthStateChange met déjà à jour session */ }} />
      )}

      {route === "admin" && authChecked && isAdmin && (
        <AdminDashboard
          products={products} setProducts={setProducts}
          brands={brands} setBrands={setBrands}
          categories={categories} setCategories={setCategories}
          saveStatus={saveStatus}
          onSignOut={signOutAdmin}
          onReloadProducts={reloadProducts}
          productsLoading={productsLoading}
          productsError={productsError}
          onReloadBrands={reloadBrands}
          brandsLoading={brandsLoading}
          brandsError={brandsError}
          reviews={reviews} setReviews={setReviews}
          onReloadReviews={reloadReviews}
          reviewsLoading={reviewsLoading}
          reviewsError={reviewsError}
          videoTestimonials={videoTestimonials} setVideoTestimonials={setVideoTestimonials}
          onReloadVideoTestimonials={reloadVideoTestimonials}
          videoTestimonialsLoading={videoTestimonialsLoading}
          videoTestimonialsError={videoTestimonialsError}
        />
      )}

      <Footer go={go} setCategoryFilter={setCategoryFilter} setGenderFilter={setGenderFilter} setSubcategoryFilter={setSubcategoryFilter} />

      <CartDrawer
        open={cartOpen}
        onClose={() => setCartOpen(false)}
        cart={cart}
        updateQty={updateCartQty}
        removeItem={removeCartItem}
        go={go}
      />
      <FloatingWhatsAppButton />
      <ScrollToTopButton />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
