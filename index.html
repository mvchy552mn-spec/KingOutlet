  const [categoryFilter, setCategoryFilter] = useState("all");
  const [brandFilter, setBrandFilter] = useState("all");
  const [selectedBrandId, setSelectedBrandId] = useState(null);

  /* ----- Panier WhatsApp — minimal, persistant en localStorage ----- */
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [cartLoaded, setCartLoaded] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(CART_STORAGE_KEY);
      if (raw) setCart(JSON.parse(raw));
    } catch (err) {}
    setCartLoaded(true);
  }, []);

  useEffect(() => {
    if (!cartLoaded) return;
    try {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    } catch (err) {}
  }, [cart, cartLoaded]);

  const addToCart = (item) => {
    setCart((prev) => {
      const key = `${item.productId}__${item.size || ""}__${item.color || ""}`;
      const existing = prev.find((it) => `${it.productId}__${it.size || ""}__${it.color || ""}` === key);
      if (existing) {
        return prev.map((it) => (it === existing ? { ...it, quantity: it.quantity + item.quantity } : it));
      }
      return [...prev, { ...item, cartItemId: key + "__" + Date.now() }];
    });
    setCartOpen(true);
  };
  const updateCartQty = (cartItemId, qty) => {
    if (qty < 1) return;
    setCart((prev) => prev.map((it) => (it.cartItemId === cartItemId ? { ...it, quantity: qty } : it)));
  };
  const removeCartItem = (cartItemId) => {
    setCart((prev) => prev.filter((it) => it.cartItemId !== cartItemId));
  };
  const cartCount = cart.reduce((n, it) => n + it.quantity, 0);

  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("");

  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const isAdmin = !!(session && session.user && session.user.id === ADMIN_USER_ID);

  useEffect(() => {
    let unsubscribe = null;
    let cancelled = false;
    (async () => {
      try {
        const client = await getSupabaseAuthClient();
        const { data } = await client.auth.getSession();
        if (!cancelled) setSession(data.session || null);
        const { data: sub } = client.auth.onAuthStateChange((_event, newSession) => {
          setSession(newSession || null);
        });
        unsubscribe = () => sub.subscription.unsubscribe();
      } catch (err) {
        console.error("Supabase Auth indisponible:", err);
      } finally {
        if (!cancelled) setAuthChecked(true);
      }
    })();
    return () => {
      cancelled = true;
      if (unsubscribe) unsubscribe();
    };
  }, []);

  const signOutAdmin = async () => {
    try {
      const client = await getSupabaseAuthClient();
      await client.auth.signOut();
    } catch (err) {
      console.error("Déconnexion échouée:", err);
    }
    setSession(null);
  };

  /* ----- Produits : source de vérité = Supabase (table "products") -----
     Important : on écrase TOUJOURS products avec le résultat du SELECT,
     même si le tableau est vide. Aucun repli automatique sur
     INITIAL_PRODUCTS — si Supabase renvoie 0 ligne, le catalogue doit
     réellement afficher 0 produit. En cas d'échec réseau/RLS, on NE
     VIDE PAS le catalogue actuellement affiché (pour éviter qu'une
     coupure réseau transitoire fasse disparaître les produits à l'écran) ;
     à la place, l'erreur est stockée dans productsError et affichée. */
  const reloadProducts = async () => {
    setProductsError("");
    try {
      const fresh = await loadProductsFromSupabase();
      setProducts(fresh);
    } catch (err) {
      console.error("Chargement des produits depuis Supabase échoué:", err);
      setProductsError(
        "Impossible de charger les produits depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  /* ----- Marques : source de vérité = Supabase (table "brands") -----
     Même logique que pour les produits : le tableau "brands" est
     entièrement piloté par Supabase. En cas d'échec réseau/RLS, on
     conserve la liste de marques actuellement affichée et on stocke
     l'erreur dans brandsError plutôt que de vider la liste. */
  const reloadBrands = async () => {
    setBrandsError("");
    try {
      const fresh = await loadBrandsFromSupabase();
      setBrands(fresh);
    } catch (err) {
      console.error("Chargement des marques depuis Supabase échoué:", err);
      setBrandsError(
        "Impossible de charger les marques depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  /* ----- Avis clients : source de vérité = Supabase (table "reviews") -----
     Même logique que pour les marques : en cas d'échec réseau/RLS, on
     conserve la liste actuellement affichée et on stocke l'erreur dans
     reviewsError plutôt que de vider la liste. */
  const reloadReviews = async () => {
    setReviewsError("");
    try {
      const fresh = await loadReviewsFromSupabase();
      setReviews(fresh);
    } catch (err) {
      console.error("Chargement des avis depuis Supabase échoué:", err);
      setReviewsError(
        "Impossible de charger les avis depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  /* ----- Avis vidéo : source de vérité = Supabase (table "video_testimonials") -----
     Même logique que pour les avis clients : en cas d'échec réseau/RLS, on
     conserve la liste actuellement affichée et on stocke l'erreur dans
     videoTestimonialsError plutôt que de vider la liste. */
  const reloadVideoTestimonials = async () => {
    setVideoTestimonialsError("");
    try {
      const fresh = await loadVideoTestimonialsFromSupabase();
      setVideoTestimonials(fresh);
    } catch (err) {
      console.error("Chargement des avis vidéo depuis Supabase échoué:", err);
      setVideoTestimonialsError(
        "Impossible de charger les avis vidéo depuis Supabase : " +
          (err && err.message ? err.message : String(err))
      );
    }
  };

  useEffect(() => {
    reloadProducts().finally(() => { setProductsLoading(false); setLoaded(true); });
    reloadBrands().finally(() => { setBrandsLoading(false); });
    reloadReviews().finally(() => { setReviewsLoading(false); });
    reloadVideoTestimonials().finally(() => { setVideoTestimonialsLoading(false); });
  }, []);

  /* ----- Catégories : encore en localStorage pour l'instant -----
     Les marques ne sont plus lues/écrites ici : elles viennent
     exclusivement de Supabase (table "brands", voir reloadBrands
     ci-dessus). Seules les catégories restent gérées en local. */
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (Array.isArray(data.categories)) setCategories(data.categories);
      }
    } catch (err) {
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveStatus("enregistrement");
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ categories }));
      setSaveStatus("enregistré");
    } catch (err) {
      setSaveStatus("erreur");
    }
  }, [categories, loaded]);

  const go = (r) => {
    setRoute(r);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const openProduct = (id) => {
    setSelectedProductId(id);
    setRoute("product");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const selectedProduct = products.find((p) => p.id === selectedProductId);
  const selectedBrand = selectedProduct ? brands.find((b) => b.id === selectedProduct.brandId) : null;

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh" }}>
      <style>{FONT_IMPORT}{`
        * { box-sizing: border-box; }
        html { overflow-x: hidden; width: 100%; }
        body { margin: 0; background: ${COLORS.bg}; overflow-x: hidden; width: 100%; }
        select, input, textarea { outline: none; }
        select:focus, input:focus, textarea:focus { outline: 2px solid ${COLORS.magenta}; outline-offset: 1px; }
        button:focus-visible, a:focus-visible { outline: 2px solid ${COLORS.magenta}; outline-offset: 2px; }
        ::selection { background: ${COLORS.magenta}; color: #08060D; }

        .neon-text {
          background: linear-gradient(90deg, ${COLORS.purple}, ${COLORS.magenta} 45%, ${COLORS.blue} 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          filter: drop-shadow(0 0 18px rgba(255,46,196,0.45)) drop-shadow(0 0 36px rgba(139,47,232,0.35));
        }
        .neon-border {
          border: 1px solid ${COLORS.purple};
          box-shadow: 0 0 8px rgba(139,47,232,0.55), 0 0 22px rgba(255,46,196,0.25), inset 0 0 8px rgba(139,47,232,0.15);
        }
        @keyframes neonPulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.72; }
        }
        .neon-pulse { animation: neonPulse 2.4s ease-in-out infinite; }

        /* ---- Hero : micro-animations (lumière, flottement, CTA, scroll) ---- */
        @keyframes heroGlowDrift {
          0%, 100% { transform: translate3d(0,0,0) scale(1); }
          50% { transform: translate3d(1.5%, -1.5%, 0) scale(1.03); }
        }
        .hero-glow-drift { animation: heroGlowDrift 14s ease-in-out infinite; will-change: transform; }
        .hero-glow-drift-slow { animation: heroGlowDrift 22s ease-in-out infinite; will-change: transform; }

        @keyframes heroFloatA {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-7px); }
        }
        @keyframes heroFloatB {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(7px); }
        }
        .hero-float-a { animation: heroFloatA 7s ease-in-out infinite; }
        .hero-float-b { animation: heroFloatB 8s ease-in-out infinite; }

        @keyframes heroBadgeFloat {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-4px); }
        }
        .hero-badge-float { animation: heroBadgeFloat 3.6s ease-in-out infinite; }

        .hero-cta-primary { position: relative; }
        .hero-cta-primary:hover {
          box-shadow: 0 0 30px rgba(255,46,196,0.75), 0 0 70px rgba(139,47,232,0.4) !important;
          transform: translateY(-1px);
        }

        @keyframes heroScrollDot {
          0% { transform: translateY(0); opacity: 0; }
          30% { opacity: 1; }
          80% { opacity: 0; }
          100% { transform: translateY(14px); opacity: 0; }
        }
        .hero-scroll-dot {
          display: block;
          width: 4px;
          height: 4px;
          border-radius: 999px;
          background: ${COLORS.magenta};
          box-shadow: 0 0 8px rgba(255,46,196,0.8);
        }
        .hero-scroll-dot::before {
          content: "";
          display: block;
          width: 1px;
          height: 22px;
          margin: 0 auto 6px;
          background: linear-gradient(180deg, transparent, ${COLORS.inkDim});
        }
        .hero-scroll-dot { position: relative; animation: heroScrollDot 2s ease-in-out infinite; }

        @media (max-width: 767px) {
          .hero-float-a, .hero-float-b, .hero-glow-drift, .hero-glow-drift-slow, .hero-badge-float {
            animation: none;
          }
        }

        /* ---- Avis clients : carrousel, cartes, avis vidéo ---- */
        .reviews-track::-webkit-scrollbar { display: none; }
        .reviews-track { -ms-overflow-style: none; }

        .review-card:hover {
          transform: translateY(-3px);
          border-color: ${COLORS.purpleDim};
          box-shadow: 0 26px 50px -24px rgba(0,0,0,0.7), 0 0 24px rgba(139,47,232,0.18);
        }
        .review-card:hover .review-card-glow { opacity: 1; }
        .review-card { transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), border-color 0.3s ease, box-shadow 0.3s ease; }
        .review-card-glow { transition: opacity 0.3s ease; }

        .line-clamp-2 {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          overflow: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
          .review-card:hover { transform: none; }
        }

        /* Bandeau marques — défilement continu, boucle parfaite (contenu dupliqué x2, translation de -50%) */
        @keyframes brandMarqueeScroll {
          from { transform: translateX(0); }
          to { transform: translateX(-50%); }
        }
        .brand-marquee-track {
          width: max-content;
          animation: brandMarqueeScroll 48s linear infinite;
          will-change: transform;
        }
        .brand-marquee-wrap:hover .brand-marquee-track {
          animation-play-state: paused;
        }

        /* ---- Menu mobile plein écran : transition d'entrée entre niveaux ---- */
        @keyframes menuPanelIn {
          from { opacity: 0; transform: translateX(14px); }
          to { opacity: 1; transform: translateX(0); }
        }
        .mobile-menu-panel { animation: menuPanelIn .22s cubic-bezier(0.16,1,0.3,1); }
        .mobile-cat-card, .mobile-brand-card {
          transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
        }
        .mobile-cat-card:active, .mobile-brand-card:active {
          transform: scale(0.98);
        }
        .mobile-cat-card:hover, .mobile-brand-card:hover {
          border-color: ${COLORS.purpleDim};
          background: ${COLORS.surface};
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
            scroll-behavior: auto !important;
          }
        }
      `}</style>

      <Header
        route={route}
        go={go}
        categories={categories}
        brands={brands}
        products={products}
        setCategoryFilter={setCategoryFilter}
        setBrandFilter={setBrandFilter}
        setSelectedBrandId={setSelectedBrandId}
        cartCount={cartCount}
        onOpenCart={() => setCartOpen(true)}
      />

      {route === "home" && (
        <>
          <Hero go={go} />
          <CategoryGrid go={go} setCategoryFilter={setCategoryFilter} />
          <section className="max-w-7xl mx-auto px-5 md:px-8 pb-16">
            <div className="flex items-end justify-between mb-6">
              <Reveal>
                <div>
                  <Eyebrow>Nouveautés</Eyebrow>
                  <h2 className="mt-3" style={{ fontFamily: "Anton", fontSize: "clamp(24px,4vw,36px)", color: COLORS.ink }}>DERNIÈRES ARRIVÉES</h2>
                </div>
              </Reveal>
              <GhostButton onClick={() => go("catalog-new")}>Voir tout</GhostButton>
            </div>
            <RevealGroup className="grid grid-cols-2 md:grid-cols-4 gap-5" step={70} y={20}>
              {products.filter((p) => p.isNew).slice(0, 4).map((p) => (
                <ProductCard key={p.id} product={p} brand={brands.find((b) => b.id === p.brandId)} onOpen={openProduct} />
              ))}
            </RevealGroup>
          </section>
          <section className="max-w-7xl mx-auto px-5 md:px-8 pb-20">
            <div className="flex items-end justify-between mb-6">
              <Reveal>
                <div>
                  <Eyebrow>Sélection</Eyebrow>
                  <h2 className="mt-3" style={{ fontFamily: "Anton", fontSize: "clamp(24px,4vw,36px)", color: COLORS.ink }}>NOS MEILLEURES VENTES</h2>
                </div>
              </Reveal>
              <GhostButton onClick={() => go("catalog-featured")}>Voir tout</GhostButton>
            </div>
            <RevealGroup className="grid grid-cols-2 md:grid-cols-4 gap-5" step={70} y={20}>
              {products.filter((p) => p.featured).slice(0, 4).map((p) => (
                <ProductCard key={p.id} product={p} brand={brands.find((b) => b.id === p.brandId)} onOpen={openProduct} />
              ))}
            </RevealGroup>
          </section>
          <ReviewsSection reviews={reviews} videoTestimonials={videoTestimonials} />
        </>
      )}

      {route === "catalog" && (
        <Catalog products={products} brands={brands} initialCategory={categoryFilter} initialBrand={brandFilter} forceNew={false} onOpen={openProduct} go={go} />
      )}
      {route === "catalog-new" && (
        <Catalog products={products} brands={brands} initialCategory="all" initialBrand="all" forceNew={true} onOpen={openProduct} go={go} />
      )}
      {route === "catalog-featured" && (
        <Catalog products={products} brands={brands} initialCategory="all" initialBrand="all" forceFeatured={true} onOpen={openProduct} go={go} />
      )}

      {route === "product" && selectedProduct && (
        <ProductPage product={selectedProduct} brand={selectedBrand} products={products} brands={brands} onOpen={openProduct} go={go} onAddToCart={addToCart} />
      )}

      {route === "brands" && (
        <BrandsPage brands={brands} products={products} onOpenBrand={setSelectedBrandId} selectedBrand={selectedBrandId} onOpen={openProduct} go={go} />
      )}

      {route === "about" && <AboutPage go={go} />}

      {route === "contact" && <ContactPage />}

      {route === "admin" && !authChecked && (
        <section className="max-w-7xl mx-auto px-5 md:px-8 py-20 text-center">
          <p className="text-sm" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Vérification de la session…</p>
        </section>
      )}

      {route === "admin" && authChecked && !isAdmin && (
        <AdminLogin onSignedIn={() => { /* onAuthStateChange met déjà à jour session */ }} />
      )}

      {route === "admin" && authChecked && isAdmin && (
        <AdminDashboard
          products={products} setProducts={setProducts}
          brands={brands} setBrands={setBrands}
          categories={categories} setCategories={setCategories}
          saveStatus={saveStatus}
          onSignOut={signOutAdmin}
          onReloadProducts={reloadProducts}
          productsLoading={productsLoading}
          productsError={productsError}
          onReloadBrands={reloadBrands}
          brandsLoading={brandsLoading}
          brandsError={brandsError}
          reviews={reviews} setReviews={setReviews}
          onReloadReviews={reloadReviews}
          reviewsLoading={reviewsLoading}
          reviewsError={reviewsError}
          videoTestimonials={videoTestimonials} setVideoTestimonials={setVideoTestimonials}
          onReloadVideoTestimonials={reloadVideoTestimonials}
          videoTestimonialsLoading={videoTestimonialsLoading}
          videoTestimonialsError={videoTestimonialsError}
        />
      )}

      <Footer go={go} setCategoryFilter={setCategoryFilter} />

      <CartDrawer
        open={cartOpen}
        onClose={() => setCartOpen(false)}
        cart={cart}
        updateQty={updateCartQty}
        removeItem={removeCartItem}
        go={go}
      />
      <FloatingWhatsAppButton />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
