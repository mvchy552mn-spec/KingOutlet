<script>
  // Ajout du palier "xs" (petits smartphones) utilisé par endroits dans le fichier
  // (ex: hero) mais absent des paliers Tailwind par défaut — sans ceci ces classes
  // ne produisaient aucune règle CSS.
  //
  // maxWidth 7xl : le conteneur global du site (header, footer, catalogue, fiche
  // produit, etc.) utilise systématiquement "max-w-7xl" — c'est le point de
  // centralisation unique de la largeur du site. On l'élargit légèrement ici
  // (1280px -> 1408px, +10%) pour que TOUTES les sections en profitent en même
  // temps et gardent une cohérence parfaite, sans devoir modifier chaque section
  // une par une. Reste un max-width (plafond) : sur tablette/mobile, où l'écran
  // est plus étroit que cette valeur, rien ne change — le site reste 100% responsive.
  tailwind.config = { theme: { extend: { screens: { xs: "475px" }, maxWidth: { "7xl": "88rem" } } } };
</script>

   ou la liste unisexe si la catégorie n'a pas de Genre. */

  const tree = CATALOG_TREE[catId];

  if (tree.unisexe) return tree.unisexe;
  return tree[gender] || [];
}

/* Toutes les sous-catégories d'une catégorie, tous genres confondus
   (utilisé quand le filtre Genre est sur "Tous"). */
function allSubcatsForCategory(catId) {
  const tree = CATALOG_TREE[catId];
  if (!tree) return [];
  if (tree.unisexe) return tree.unisexe;
  return Array.from(new Set([...(tree.homme || []), ...(tree.femme || [])]));
}

function loadSupabaseSdk() {

  if (sessionError || !sessionData || !sessionData.session) {

const ACCEPTED_IMAGE_TYPES = [
  "image/jpeg", "image/jpg", "image/png", "image/webp",

];
const EXT_BY_MIME = {

  "image/heic": "heic", "image/heif": "heif",
};

async function detectRealImageType(file) {
  try {
    const buf = await file.slice(0, 12).arrayBuffer();
    const b = new Uint8Array(buf);
    if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return "image/jpeg";
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return "image/png";
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) return "image/webp";
    const ascii = String.fromCharCode(...b.slice(4, 12));
    if (ascii.startsWith("ftyp") && /heic|heix|hevc|hevx|mif1|msf1/.test(ascii)) return "image/heic";
  } catch {
  }
  return null;
}

async function isHeicFile(file) {
  const type = (file.type || "").toLowerCase();
  if (type === "image/heic" || type === "image/heif") return true;
  const name = (file.name || "").toLowerCase();
  const looksHeicByName = name.endsWith(".heic") || name.endsWith(".heif");
  const realType = await detectRealImageType(file);
  if (realType === "image/heic") return true;
  if (realType) return false;
  return looksHeicByName;
}

let heic2anyLoadingPromise = null;
function loadHeic2any() {
  if (typeof window !== "undefined" && typeof window.heic2any === "function") {
    return Promise.resolve();
  }
  if (heic2anyLoadingPromise) return heic2anyLoadingPromise;
  heic2anyLoadingPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Impossible de charger le convertisseur HEIC"));
    document.head.appendChild(script);
  });
  return heic2anyLoadingPromise;
}

async function convertHeicIfNeeded(file) {
  const heic = await isHeicFile(file);
  if (!heic) return file;
  try {
    await loadHeic2any();
  } catch (err) {
    throw new Error("Conversion HEIC indisponible (échec de chargement)");
  }
  if (typeof window.heic2any !== "function") {
    throw new Error("Conversion HEIC indisponible (librairie non chargée)");
  }
  const convertedBlob = await window.heic2any({
    blob: file,
    toType: "image/jpeg",
    quality: 0.9,
  });
  const blob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
  const originalName = (file.name || "photo").replace(/\.(heic|heif)$/i, "");
  return new File([blob], `${originalName}.jpg`, { type: "image/jpeg" });
}

async function uploadToSupabase(file, accessToken, onStep) {
  const trace = (step, ok, detail) => onStep && onStep(step, ok, detail);
  if (!accessToken) {
    trace("connexion", false, "Vous devez être connecté en tant qu'administrateur.");
    throw new Error("Vous devez être connecté en tant qu'administrateur.");
  }
  trace("selection", true, `${file.name || "(sans nom)"} — type déclaré: "${file.type || "(vide)"}"`);
  const realType = await detectRealImageType(file);
  const looksHeicByName = /\.(heic|heif)$/i.test(file.name || "");
  const effectiveType = realType || (ACCEPTED_IMAGE_TYPES.includes(file.type) ? file.type : null);
  if (!effectiveType && !looksHeicByName) {
    trace("conversion", false, "Signature binaire non reconnue comme image (JPEG/PNG/WEBP/HEIC)");
    throw new Error("Ce fichier ne semble pas être une image supportée");
  }
  let usableFile = file;
  const isHeic = effectiveType === "image/heic" || (!realType && looksHeicByName);
  if (isHeic) {
    try {
      usableFile = await convertHeicIfNeeded(file);
      trace("conversion", true, `Converti en JPEG (${(usableFile.size / 1024).toFixed(0)} Ko)`);
    } catch (err) {
      trace("conversion", false, err.message || String(err));
      throw err;
    }
  } else {
    usableFile = effectiveType && effectiveType !== file.type
      ? new File([file], file.name || "photo", { type: effectiveType })
      : file;
    trace("conversion", true, "Aucune conversion nécessaire");
  }
  const finalType = usableFile.type || effectiveType || "image/jpeg";
  const path = makeStoragePath(finalType);
  const uploadUrl = `${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${path}`;
  let res;
  try {
    res = await fetch(uploadUrl, {
      method: "POST",
      headers: {
        "Content-Type": finalType,
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": `Bearer ${accessToken}`,
        "x-upsert": "false",
      },
      body: usableFile,
    });
  } catch (networkErr) {
    trace("connexion", false, `Requête réseau impossible vers Supabase : ${networkErr.message || networkErr}`);
    throw new Error(`Connexion à Supabase impossible : ${networkErr.message || networkErr}`);
  }
  trace("connexion", true, `Réponse reçue du serveur Supabase (HTTP ${res.status})`);
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      detail = body.message || body.error || JSON.stringify(body);
    } catch {
      try { detail = await res.text(); } catch {}
    }
    trace("upload", false, detail);
    throw new Error(`Upload Supabase Storage échoué (${res.status}) : ${detail}`);
  }
  trace("upload", true, `Fichier stocké sous ${SUPABASE_BUCKET}/${path}`);
  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${path}`;
  trace("url", true, publicUrl);
  return { publicUrl, path };
}

async function detectRealVideoType(file) {
  try {
    const buf = await file.slice(0, 32).arrayBuffer();
    const b = new Uint8Array(buf);
    // WEBM / MKV (conteneur EBML)
    if (b[0] === 0x1a && b[1] === 0x45 && b[2] === 0xdf && b[3] === 0xa3) return "video/webm";
    // MP4 / MOV : boîte "ftyp" à l'offset 4, avec un "brand" indiquant le sous-type
    const ascii = String.fromCharCode(...b.slice(4, 12));
    if (ascii.startsWith("ftyp")) {
      const brand = ascii.slice(4, 8).toLowerCase();
      if (brand.startsWith("qt")) return "video/quicktime";
      return "video/mp4"; // isom, mp42, mp41, M4V , avc1, etc.
    }
  } catch {
  }
  return null;
}

/* ============================================================
   SUPABASE — table "products" (persistance réelle des fiches produit)
   ------------------------------------------------------------
   Conversion entre le format "row" de la table Supabase (snake_case)
   et le format "product" utilisé côté React (camelCase), + helper de
   chargement de la liste complète depuis Supabase.
   ============================================================ */

/* Statut de disponibilité d'un produit — trois valeurs possibles :
   "disponible"    -> article en stock, expédiable rapidement (badge vert)
   "sur_commande"  -> article non stocké, commandable auprès du fournisseur (badge orange)
   "indisponible"  -> article momentanément indisponible (badge rouge)
   normalizeAvailability() assure la rétrocompatibilité avec l'ancienne colonne
   booléenne "availability" (true/false) qui pouvait exister dans Supabase avant
   l'ajout de ce statut : true -> disponible, false -> sur_commande. */
function normalizeAvailability(value) {
  if (value === "disponible" || value === "sur_commande" || value === "indisponible") return value;
  if (value === false) return "sur_commande";
  return "disponible";
}

/* Source unique de vérité pour l'affichage de la disponibilité — badge, icône,
   libellé et texte de livraison associé. Utilisée partout où le statut d'un
   produit doit être affiché (cartes produits, fiche produit, panier, admin)
   afin de garantir une formulation strictement identique sur tout le site. */
const AVAILABILITY_INFO = {
  disponible: {
    label: "Disponible",
    emoji: "🟢",
    badgeTone: "success",
    statusLine: "EN STOCK",
    deliveryText: "En stock — expédition/livraison sous 48 à 72h",
    shortDelay: "Expédition sous 48 à 72h (produit en stock)",
  },
  sur_commande: {
    label: "Sur commande",
    emoji: "🟠",

    statusLine: "SUR COMMANDE",
    deliveryText: "Sur commande — délai de livraison estimé à environ 2 semaines",
    shortDelay: "Livraison estimée à environ 2 semaines (sur commande)",
  },
  indisponible: {
    label: "Indisponible",

    badgeTone: "danger",
    statusLine: "INDISPONIBLE",
    deliveryText: "Produit momentanément indisponible",
    shortDelay: "Produit momentanément indisponible",
  },
};

function getAvailabilityInfo(value) {
  return AVAILABILITY_INFO[normalizeAvailability(value)];
}

/* ---------------- Scroll reveal system ----------------
   Léger, basé sur IntersectionObserver, respecte prefers-reduced-motion,
   utilise uniquement transform + opacity (perf). Utilisable partout :
   <Reveal><Section /></Reveal> ou <Reveal delay={80}><Card /></Reveal>
------------------------------------------------------------- */
const prefersReducedMotion =
  typeof window !== "undefined" && window.matchMedia
    ? window.matchMedia("(prefers-reduced-motion: reduce)").matches
    : false;

function Reveal({ children, delay = 0, y = 18, blur = true, className = "", style = {}, as = "div", once = true }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(prefersReducedMotion);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            if (once) io.unobserve(entry.target);
          } else if (!once) {
            setVisible(false);
          }
        });
      },
      { threshold: 0.14, rootMargin: "0px 0px -8% 0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [once]);

  const Tag = as;
  return (
    <Tag
      ref={ref}
      className={className}
      style={{
        ...style,
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0) scale(1)" : `translateY(${y}px) scale(0.99)`,
        filter: !prefersReducedMotion && blur ? (visible ? "blur(0px)" : "blur(4px)") : "none",
        transition: prefersReducedMotion
          ? "none"
          : `opacity 0.6s cubic-bezier(0.16,1,0.3,1) ${delay}ms, transform 0.6s cubic-bezier(0.16,1,0.3,1) ${delay}ms, filter 0.5s ease ${delay}ms`,
        willChange: "opacity, transform",
      }}
    >
      {children}
    </Tag>
  );
}

/* Grille avec stagger automatique : chaque enfant direct reçoit un délai croissant */
function RevealGroup({ children, step = 70, y = 16, className = "" }) {
  const items = React.Children.toArray(children);
  return (
    <div className={className}>
      {items.map((child, i) => (
        <Reveal key={child.key ?? i} delay={i * step} y={y}>
          {child}
        </Reveal>
      ))}
    </div>
  );
}

  //   { id, name, step: "brands" }             -> catégorie sans sous-catégories (ex : Montres) : liste de marques (comportement d'origine)
  //   { id, name, step: "gender" }              -> catégorie avec Homme/Femme : choix du genre
  //   { id, name, step: "subcats", gender }     -> liste des sous-catégories (gender = null si catégorie unisexe, ex : Casquettes)
  const [mobileLevel, setMobileLevel] = useState(null);
  const closeTimer = useRef(null);

  /* Navbar auto-hide au scroll : on descend → la navbar se cache pour laisser
     de la place au contenu ; on remonte (même très légèrement) → elle revient
     immédiatement. Toujours visible tout en haut de page. Purement CSS transform
     (translateY), donc fluide et peu coûteux ; aucun impact sur le layout puisque
     le header reste "sticky" (il ne quitte pas le flux, il se translate au-dessus).

     Le delta est accumulé depuis le dernier changement de direction (et non
     frame à frame) : avec l'inertie du scroll mobile, un flick vers le haut
     envoie une rafale de tout petits deltas positifs qui, comparés un à un à
     un seuil, ne le dépassaient jamais → la navbar ne réapparaissait pas. */
  const [navHidden, setNavHidden] = useState(false);
  const lastScrollY = useRef(0);
  const accumRef = useRef(0);
  const directionRef = useRef(0); // -1 = vers le haut, 1 = vers le bas, 0 = neutre
  useEffect(() => {
    lastScrollY.current = window.scrollY || 0;
    let raf = null;
    const THRESHOLD = 10; // distance cumulée avant de basculer, pour ignorer les micro-scrolls
    const TOP_OFFSET = 80; // toujours visible tant qu'on est proche du haut de page
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const y = Math.max(0, window.scrollY || 0);
        const diff = y - lastScrollY.current;
        lastScrollY.current = y;
        raf = null;

        if (y <= TOP_OFFSET) {
          setNavHidden(false);
          accumRef.current = 0;
          directionRef.current = 0;
          return;
        }
        if (diff === 0) return;

        const dir = diff > 0 ? 1 : -1;
        if (dir !== directionRef.current) {
          // changement de sens : on repart de zéro pour l'accumulation
          directionRef.current = dir;
          accumRef.current = 0;
        }
        accumRef.current += Math.abs(diff);

        if (accumRef.current >= THRESHOLD) {
          setNavHidden(dir > 0); // dir > 0 = on descend -> cachée ; dir < 0 = on remonte -> visible
        }
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.removeEventListener("scroll", onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);
  // Un menu ouvert (desktop ou mobile) garde toujours la navbar visible — on ne
  // cache jamais la navbar pendant qu'un menu est en cours de consultation.
  const navTranslateHidden = navHidden && !openMenu && !open;

  const CATS = categories && categories.length ? categories : CATEGORIES;
  const BRAND_LIST = brands && brands.length ? brands : [];
  const PRODUCT_LIST = products || [];

  const NAV = [
    { route: "home", label: "Accueil" },
    { route: "catalog", label: "Catalogue", dropdown: "categories" },
    { route: "catalog-new", label: "Nouveautés" },
    { route: "brands", label: "Marques", dropdown: "brands" },
    { route: null, label: "Recherche d'article", dropdown: "search" },
    { route: "contact", label: "Contact" },
  ];

  const openDropdown = (key) => {
    if (closeTimer.current) { clearTimeout(closeTimer.current); closeTimer.current = null; }
    setOpenMenu(key);
    if (key === "categories") setHoveredCategory((h) => h || (CATS[0] && CATS[0].id) || null);
  };
  const scheduleClose = () => {
    if (closeTimer.current) clearTimeout(closeTimer.current);
    closeTimer.current = setTimeout(() => setOpenMenu(null), 160);
  };

  /* Marques ayant réellement au moins un produit dans la catégorie donnée
     — calculé dynamiquement à partir des données Supabase (products/brands),
     jamais d'une liste codée en dur. */
  const brandsInCategory = (catId) => {
    if (!catId || catId === "all") return BRAND_LIST;
    const ids = new Set(PRODUCT_LIST.filter((p) => p.categoryId === catId).map((p) => p.brandId));
    return BRAND_LIST.filter((b) => ids.has(b.id));
  };

  const goCategory = (catId) => {
    setCategoryFilter(catId);
    setBrandFilter("all");
    setGenderFilter("all");
    setSubcategoryFilter("all");
    go("catalog");
    setOpenMenu(null);
    setOpen(false);
    setMobileLevel(null);
  };
  const goCategoryBrand = (catId, brandId) => {
    setCategoryFilter(catId);
    setBrandFilter(brandId);
    setGenderFilter("all");
    setSubcategoryFilter("all");
    go("catalog");
    setOpenMenu(null);
    setOpen(false);
    setMobileLevel(null);
  };
  /* Navigation vers une sous-catégorie : Catalogue → Catégorie → Homme/Femme → Sous-catégorie → Produits */
  const goSubcategory = (catId, gender, subcat) => {
    setCategoryFilter(catId);
    setBrandFilter("all");
    setGenderFilter(gender || "all");
    setSubcategoryFilter(subcat || "all");
    go("catalog");
    setOpenMenu(null);
    setOpen(false);
    setMobileLevel(null);
  };
  const goBrand = (brandId) => {
    setSelectedBrandId(brandId);
    go("brands");
    setOpenMenu(null);
    setOpen(false);
    setMobileLevel(null);
  };

  /* Clic racine (mobile) sur une catégorie : dirige vers l'étape appropriée
     selon que la catégorie a un niveau Genre, un niveau Sous-catégorie
     unisexe, ou ni l'un ni l'autre (comportement d'origine : marques). */
  const openMobileCategory = (c) => {
    const genders = gendersForCategory(c.id);
    if (genders.length > 0) {
      setMobileLevel({ id: c.id, name: c.name, step: "gender" });
    } else if (CATALOG_TREE[c.id]) {
      setMobileLevel({ id: c.id, name: c.name, step: "subcats", gender: null });
    } else {
      setMobileLevel({ id: c.id, name: c.name, step: "brands" });
    }
  };

  const mobileBack = () => {
    if (!mobileLevel) return;
    if (mobileLevel.step === "subcats" && mobileLevel.gender) {
      setMobileLevel({ id: mobileLevel.id, name: mobileLevel.name, step: "gender" });
    } else {
      setMobileLevel(null);
    }
  };

  const closeMobileMenu = () => {
    setOpen(false);
    setMobileLevel(null);
  };

  /* Verrouille le scroll de la page derrière le menu plein écran mobile,
     et permet de le fermer avec la touche Échap. */
  useEffect(() => {
    if (!open) return;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") closeMobileMenu(); };
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = prevOverflow;
      window.removeEventListener("keydown", onKey);
    };
  }, [open]);

  return (
    <>
    <header
      className="sticky top-0 z-40 border-b relative"
      style={{
        background: "rgba(15,8,6,0.92)",
        backdropFilter: "blur(10px)",
        borderColor: COLORS.line,
        transform: navTranslateHidden ? "translateY(-100%)" : "translateY(0)",
        transition: "transform 0.35s cubic-bezier(0.16,1,0.3,1)",
        willChange: "transform",
      }}
      onMouseLeave={scheduleClose}
    >
      <div className="max-w-7xl mx-auto h-16 grid grid-cols-[1fr_auto_1fr] lg:flex lg:justify-between items-center gap-2 pl-4 pr-5 sm:pl-5 sm:pr-6 md:px-8">
        {/* Colonne gauche — sur mobile, contient le bouton hamburger (aligné à gauche).
            Disparaît en desktop (lg:hidden), où l'on repasse en flex classique via lg:flex. */}
        <div className="lg:hidden justify-self-start flex items-center">
          <button
            className="relative flex flex-col items-center justify-center gap-1.5 p-2.5 -m-2.5 shrink-0"
            onClick={() => setOpen((o) => !o)}
            aria-label={open ? "Fermer le menu" : "Ouvrir le menu"}
            aria-expanded={open}
          >
            <span style={{ width: 22, height: 2, background: COLORS.ink, display: "block", transition: "transform .2s ease, opacity .2s ease", transform: open ? "translateY(3.5px) rotate(45deg)" : "none" }} />
            <span style={{ width: 22, height: 2, background: COLORS.ink, display: "block", transition: "opacity .15s ease", opacity: open ? 0 : 1 }} />
            <span style={{ width: open ? 22 : 14, height: 2, background: open ? COLORS.ink : COLORS.magenta, display: "block", transition: "transform .2s ease, width .2s ease", transform: open ? "translateY(-3.5px) rotate(-45deg)" : "none" }} />
          </button>
        </div>

        {/* Logo — image officielle fournie, centrée par construction (colonne centrale "auto"
            d'une grille aux deux colonnes latérales égales). */}
        <button
          onClick={() => { go("home"); setOpenMenu(null); }}
          className="flex items-center leading-none justify-self-center lg:justify-self-auto"
          aria-label="King Outlet — Retour à l'accueil"
        >
          <img
            src={LOGO_SRC}
            alt="King Outlet"
            draggable="false"
            className="h-11 sm:h-12 lg:h-14 w-auto max-w-none object-contain select-none"

        <nav className="hidden lg:flex items-center gap-7 h-full">
          {NAV.map((item) => (
            <div
              key={item.route || item.dropdown}
              className="h-full flex items-center"
              onMouseEnter={() => item.dropdown && openDropdown(item.dropdown)}

              <button
                onClick={() => {
                  // "Recherche d'article" n'a pas de route propre : sur clic (ex. tactile/trackpad
                  // sans hover), on se contente d'ouvrir/garder ouvert son panneau mega-menu.
                  if (!item.route) { openDropdown(item.dropdown); return; }
                  go(item.route);
                  setOpenMenu(null);
                }}
                className="text-xs uppercase tracking-widest font-medium flex items-center gap-1.5"
                style={{
                  fontFamily: "Inter",
                  color:
                    (item.route && (route === item.route || (item.route === "catalog" && route === "product")))
                      ? COLORS.magenta
                      : openMenu === item.dropdown && item.dropdown
                      ? COLORS.ink
                      : COLORS.inkDim,
                }}
              >
                {item.dropdown && (
                  <svg
                    width="9" height="9" viewBox="0 0 9 9" fill="none"
                    style={{ transition: "transform .2s ease", transform: openMenu === item.dropdown ? "rotate(180deg)" : "rotate(0deg)" }}
                  >
                    <path d="M1 2.5L4.5 6L8 2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                )}
                {item.label}
              </button>
            </div>
          ))}
        </nav>

        {/* Panier — toujours à DROITE : colonne "1fr" de droite sur mobile
            (justify-self-end + justify-end interne), position naturelle à droite en desktop. */}
        <div className="flex items-center justify-end gap-5 lg:gap-4 justify-self-end lg:justify-self-auto">
          <button onClick={() => go("admin")} className="hidden md:inline text-[11px] uppercase tracking-widest" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
            Admin
          </button>
          <CartIconButton count={cartCount || 0} onClick={onOpenCart} />
        </div>
      </div>

      {/* Méga-menu desktop — catégorie survolée à gauche, marques réellement disponibles (Supabase) à droite */}
      <div
        className="hidden lg:block absolute left-0 right-0 top-full"
        style={{
          background: COLORS.surface,
          borderTop: `1px solid ${COLORS.purpleDim}`,
          borderBottom: `1px solid ${COLORS.line}`,
          boxShadow: openMenu ? "0 26px 50px rgba(0,0,0,0.55), 0 0 24px rgba(232,121,46,0.18)" : "none",
          opacity: openMenu ? 1 : 0,
          visibility: openMenu ? "visible" : "hidden",
          transform: openMenu ? "translateY(0)" : "translateY(-10px)",
          transition: "opacity .22s ease, transform .22s ease, visibility .22s",
          pointerEvents: openMenu ? "auto" : "none",
        }}
        onMouseEnter={() => openMenu && openDropdown(openMenu)}
      >
        <div className="max-w-7xl mx-auto px-8 py-8">
          {openMenu === "categories" && (
            <div className="grid grid-cols-12 gap-8">
              <div className="col-span-4 flex flex-col gap-1 pr-6 border-r" style={{ borderColor: COLORS.line }}>
                {CATS.map((c) => (
                  <button
                    key={c.id}
                    onMouseEnter={() => setHoveredCategory(c.id)}
                    onClick={() => goCategory(c.id)}
                    className="text-left px-3 py-2.5 rounded-sm flex items-center justify-between transition-colors"
                    style={{ background: hoveredCategory === c.id ? COLORS.surface2 : "transparent" }}
                  >
                    <div>
                      <div className="text-[10px] tracking-widest" style={{ fontFamily: "IBM Plex Mono", color: COLORS.goldDim }}>{c.tag}</div>
                      <div className="mt-1 text-sm uppercase tracking-wide font-semibold" style={{ fontFamily: "Inter", color: hoveredCategory === c.id ? COLORS.magenta : COLORS.ink }}>{c.name}</div>
                    </div>
                    <span style={{ color: COLORS.inkDim }}>→</span>
                  </button>
                ))}
                <button onClick={() => goCategory("all")} className="text-left pt-4 mt-2 border-t" style={{ borderColor: COLORS.line }}>
                  <span className="text-xs uppercase tracking-widest font-semibold" style={{ fontFamily: "Inter", color: COLORS.magenta }}>Voir tout le catalogue →</span>
                </button>
              </div>
              <div className="col-span-8">
                {(() => {
                  const activeCat = CATS.find((c) => c.id === hoveredCategory) || CATS[0];
                  if (!activeCat) return null;

                  /* Catégorie avec sous-catégories (Chaussures / Vêtements / Sacs / Casquettes) :
                     panneau Genre (si applicable) + Sous-catégories, même langage visuel que les
                     catégories principales (numéros dorés, flèches roses). */
                  const tree = CATALOG_TREE[activeCat.id];
                  if (tree) {
                    const genders = gendersForCategory(activeCat.id); // [] si catégorie unisexe (Casquettes)
                    const activeGender = genders.length ? (genders.includes(hoveredGender) ? hoveredGender : genders[0]) : null;
                    const subcats = subcatsForCategory(activeCat.id, activeGender);
                    return (
                      <div>
                        {genders.length > 0 && (
                          <div className="flex items-center gap-2 mb-5">
                            {genders.map((g) => (
                              <button
                                key={g}
                                onMouseEnter={() => setHoveredGender(g)}
                                onClick={() => setHoveredGender(g)}
                                className="px-4 py-1.5 rounded-full border text-xs uppercase tracking-widest font-semibold transition-colors"
                                style={{
                                  fontFamily: "Inter",
                                  borderColor: activeGender === g ? COLORS.purple : COLORS.line,
                                  color: activeGender === g ? COLORS.magenta : COLORS.inkDim,
                                }}
                              >
                                {GENDER_LABELS[g]}
                              </button>
                            ))}
                          </div>
                        )}
                        <div className="text-[11px] uppercase tracking-widest mb-4" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
                          Sous-catégories — {activeCat.name}{activeGender ? ` ${GENDER_LABELS[activeGender]}` : ""}
                        </div>
                        <div className="grid grid-cols-3 gap-x-6 gap-y-3.5">
                          {subcats.map((s, i) => (
                            <button
                              key={s}
                              onClick={() => goSubcategory(activeCat.id, activeGender, s)}
                              className="text-left group flex items-center gap-2"
                            >
                              <span className="text-[10px] tracking-widest shrink-0" style={{ fontFamily: "IBM Plex Mono", color: COLORS.goldDim }}>
                                {String(i + 1).padStart(2, "0")}
                              </span>
                              <span
                                className="text-sm uppercase tracking-wide font-semibold transition-colors"
                                style={{ fontFamily: "Inter", color: COLORS.ink }}
                                onMouseEnter={(e) => (e.currentTarget.style.color = COLORS.magenta)}
                                onMouseLeave={(e) => (e.currentTarget.style.color = COLORS.ink)}
                              >
                                {s}
                              </span>
                              <span className="shrink-0" style={{ color: COLORS.inkDim }}>→</span>
                            </button>
                          ))}
                        </div>
                        <button onClick={() => goCategory(activeCat.id)} className="text-left block pt-5 mt-6 border-t" style={{ borderColor: COLORS.line }}>
                          <span className="text-xs uppercase tracking-widest font-semibold" style={{ fontFamily: "Inter", color: COLORS.magenta }}>Voir tous les {activeCat.name} →</span>
                        </button>
                      </div>
                    );
                  }

                  /* Catégorie sans sous-catégories (ex : Montres) : comportement d'origine,
                     inchangé — liste des marques disponibles. */
                  const catBrands = brandsInCategory(activeCat.id);
                  return (
                    <div>
                      <div className="text-[11px] uppercase tracking-widest mb-4" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
                        Marques disponibles — {activeCat.name}
                      </div>
                      {catBrands.length === 0 ? (
                        <p className="text-sm" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Aucune marque disponible pour le moment dans cette catégorie.</p>
                      ) : (
                        <div className="grid grid-cols-3 gap-6">
                          {catBrands.map((b) => (
                            <button key={b.id} onClick={() => goCategoryBrand(activeCat.id, b.id)} className="text-left group">
                              <div
                                className="text-sm uppercase tracking-wide font-semibold transition-colors"
                                style={{ fontFamily: "Inter", color: COLORS.ink }}
                                onMouseEnter={(e) => (e.currentTarget.style.color = COLORS.magenta)}
                                onMouseLeave={(e) => (e.currentTarget.style.color = COLORS.ink)}
                              >
                                {b.name}
                              </div>
                            </button>
                          ))}
                        </div>
                      )}
                      <button onClick={() => goCategory(activeCat.id)} className="text-left block pt-5 mt-6 border-t" style={{ borderColor: COLORS.line }}>
                        <span className="text-xs uppercase tracking-widest font-semibold" style={{ fontFamily: "Inter", color: COLORS.magenta }}>Voir tous les {activeCat.name} →</span>
                      </button>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}
          {openMenu === "brands" && (
            <div className="grid grid-cols-3 gap-7">
              {BRAND_LIST.map((b) => (
                <button key={b.id} onClick={() => goBrand(b.id)} className="text-left group">
                  <div
                    className="text-sm uppercase tracking-wide font-semibold transition-colors"
                    style={{ fontFamily: "Inter", color: COLORS.ink }}
                    onMouseEnter={(e) => (e.currentTarget.style.color = COLORS.magenta)}
                    onMouseLeave={(e) => (e.currentTarget.style.color = COLORS.ink)}
                  >
                    {b.name}
                  </div>
                  <div className="mt-1 text-xs leading-snug" style={{ fontFamily: "Inter", color: COLORS.inkDim }}>{b.description}</div>
                </button>
              ))}
              {BRAND_LIST.length === 0 && (
                <p className="text-sm col-span-3" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Chargement des marques…</p>
              )}
              <button onClick={() => go("brands")} className="text-left col-span-3 pt-5 mt-1 border-t" style={{ borderColor: COLORS.line }}>
                <span className="text-xs uppercase tracking-widest font-semibold" style={{ fontFamily: "Inter", color: COLORS.magenta }}>Voir toutes les marques →</span>
              </button>
            </div>
          )}

          {openMenu === "search" && (
            <div className="grid grid-cols-12 gap-8 items-center">
              <div className="col-span-8">
                <Eyebrow>Recherche d'article</Eyebrow>
                <h3 className="mt-3 text-lg uppercase tracking-wide font-semibold" style={{ fontFamily: "Inter", color: COLORS.ink }}>
                  Envoyez-nous une photo de l'article que vous recherchez
                </h3>
                <p className="mt-2 text-sm leading-relaxed max-w-md" style={{ fontFamily: "Inter", color: COLORS.inkDim }}>
                  Vous ne trouvez pas un article dans notre catalogue ? Notre équipe le recherche pour vous dès réception de votre photo sur WhatsApp.
                </p>
              </div>
              <div className="col-span-4 flex justify-end">
                <a
                  href={whatsappLink(buildWhatsAppPhotoSearchMessage())}
                  target="_blank"
                  rel="noopener noreferrer"
                  onClick={() => setOpenMenu(null)}
                  className="inline-flex items-center justify-center gap-2.5 px-6 py-3.5 rounded-sm text-xs font-semibold uppercase tracking-wider whitespace-nowrap transition-transform duration-200 hover:scale-[1.03] active:scale-95"
                  style={{
                    background: "linear-gradient(160deg, #29e074, #1fb85c)",
                    color: "#fff",
                    fontFamily: "Inter",
                    boxShadow: "0 10px 26px rgba(37,211,102,0.35), 0 0 0 1px rgba(255,255,255,0.06)",
                  }}
                >
                  <WhatsAppGlyph size={17} color="#fff" />
                  Envoyer une photo
                </a>
              </div>
            </div>
          )}
        </div>
      </div>
    </header>

      {/* Menu mobile — navigation plein écran, hiérarchique : catégorie → marques → catalogue filtré
          Rendu HORS du <header> : le header a un backdropFilter (flou), qui crée un containing block
          CSS pour tout descendant en position fixed — un overlay fixed à l'intérieur resterait donc
          coincé dans la hauteur du bandeau du header au lieu de couvrir tout l'écran. En le sortant
          comme frère du header, "fixed" redevient relatif au viewport, comme attendu sur mobile. */}
      {open && (
        <div
          className="lg:hidden fixed inset-0 z-50 flex flex-col"
          style={{ background: COLORS.bg }}
          role="dialog"
          aria-modal="true"
          aria-label="Menu de navigation"
        >
          <div className="flex items-center justify-between px-5 h-16 border-b shrink-0" style={{ borderColor: COLORS.line }}>
            {mobileLevel ? (
              <button
                onClick={mobileBack}
                className="flex items-center gap-2.5 text-xs uppercase tracking-widest"
                style={{ fontFamily: "Inter", color: COLORS.inkDim }}
                aria-label="Retour au menu précédent"
              >
                <span
                  className="flex items-center justify-center rounded-full border"
                  style={{ width: 30, height: 30, borderColor: COLORS.line, color: COLORS.ink }}
                >
                  ←
                </span>
                Retour
              </button>
            ) : (
              <span style={{ fontFamily: "Anton", fontSize: 18, letterSpacing: 1, color: COLORS.ink }}>MENU</span>
            )}
            <button
              onClick={closeMobileMenu}
              className="flex items-center justify-center rounded-full border"
              style={{ width: 36, height: 36, borderColor: COLORS.line, color: COLORS.ink }}
              aria-label="Fermer le menu"
            >
              ✕
            </button>
          </div>

          <div className="flex-1 overflow-y-auto overscroll-contain">
            {mobileLevel === null ? (
              <div key="menu-root" className="mobile-menu-panel px-5 py-6 flex flex-col gap-2">
                <button
                  onClick={() => { go("home"); closeMobileMenu(); }}
                  className="text-left rounded-2xl border px-5 py-4"
                  style={{ borderColor: COLORS.line, fontFamily: "Anton", fontSize: 20, letterSpacing: 0.5, color: route === "home" ? COLORS.magenta : COLORS.ink }}
                >
                  Accueil
                </button>

                <div className="mt-4 mb-1 px-1 text-[11px] uppercase tracking-widest" style={{ color: COLORS.goldDim, fontFamily: "Inter" }}>Catalogue</div>
                {CATS.map((c) => (
                  <button
                    key={c.id}
                    onClick={() => openMobileCategory(c)}
                    className="mobile-cat-card text-left rounded-2xl border px-5 py-4 flex items-center justify-between"
                    style={{ borderColor: COLORS.line }}
                  >

/* ---------------- Hero ---------------- */

function Hero({ go }) {
  const wrapRef = useRef(null);
  const [parallax, setParallax] = useState(0);
  const [entered, setEntered] = useState(prefersReducedMotion);

  useEffect(() => {
    // Déclenche la chorégraphie d'entrée juste après le premier paint.
    const t = setTimeout(() => setEntered(true), 40);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (prefersReducedMotion) return;
    let raf = null;
    const isMobile = () => window.innerWidth < 768;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const el = wrapRef.current;
        if (el) {
          const rect = el.getBoundingClientRect();
          // Parallax très léger, désactivé sur mobile pour éviter tout effet nauséeux / coût de perf.
          const intensity = isMobile() ? 0 : 1;
          setParallax(Math.max(-36, Math.min(36, rect.top * -0.05 * intensity)));
        }
        raf = null;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // Choréographie d'apparition : fond -> images -> surtitre -> titre -> texte -> CTA
  const stagger = {
    bg: 0,
    images: 90,
    eyebrow: 260,
    title: 340,
    subtitle: 460,
    cta: 560,
  };

  const introStyle = (delay, y = 16, distance = 1) => ({
    opacity: entered ? 1 : 0,
    transform: entered ? "translateY(0)" : `translateY(${y * distance}px)`,
    transition: prefersReducedMotion
      ? "none"
      : `opacity 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}ms, transform 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}ms`,
  });

  const imgIntroStyle = (delay, translate) => ({
    opacity: entered ? 1 : 0,
    transform: entered
      ? `translateY(${translate}px) scale(1)`
      : `translateY(${translate + 22}px) scale(0.96)`,
    transition: prefersReducedMotion
      ? "none"
      : `opacity 0.85s cubic-bezier(0.16,1,0.3,1) ${delay}ms, transform 0.85s cubic-bezier(0.16,1,0.3,1) ${delay}ms`,
  });

  return (
    <section
      ref={wrapRef}
      className="relative overflow-hidden"
      style={{
        background: `linear-gradient(160deg, ${COLORS.bg} 0%, #241209 55%, ${COLORS.bg} 100%)`,
        minHeight: "min(820px, 86svh)",
      }}
    >
      {/* Fond cosmique — halos violet / magenta / bleu électrique, étoiles discrètes */}
      <div
        aria-hidden
        className="absolute inset-0"
        style={{ opacity: entered ? 1 : 0, transition: prefersReducedMotion ? "none" : "opacity 1s ease" }}
      >
        <div
          className="absolute inset-0 opacity-80 hero-glow-drift"
          style={{
            background: `
              radial-gradient(circle at 82% 12%, rgba(245,197,66,0.30), transparent 46%),
              radial-gradient(circle at 6% 88%, rgba(232,121,46,0.32), transparent 48%),
              radial-gradient(circle at 55% 46%, rgba(46,140,255,0.13), transparent 62%),
              radial-gradient(circle at 30% 8%, rgba(57,255,140,0.06), transparent 40%)
            `,
          }}
        />
        {/* Étoiles très discrètes */}
        <div
          className="absolute inset-0 opacity-40"
          style={{
            backgroundImage: `
              radial-gradient(1px 1px at 12% 22%, rgba(245,243,255,0.55) 50%, transparent 100%),
              radial-gradient(1px 1px at 78% 18%, rgba(245,243,255,0.4) 50%, transparent 100%),
              radial-gradient(1px 1px at 88% 62%, rgba(245,243,255,0.5) 50%, transparent 100%),
              radial-gradient(1px 1px at 24% 76%, rgba(245,243,255,0.35) 50%, transparent 100%),
              radial-gradient(1px 1px at 60% 88%, rgba(245,243,255,0.45) 50%, transparent 100%),
              radial-gradient(1px 1px at 40% 40%, rgba(245,243,255,0.3) 50%, transparent 100%)
            `,
          }}
        />
      </div>

      <div className="max-w-[1600px] mx-auto px-5 md:px-10 pt-8 pb-10 md:pt-20 md:pb-16 relative">
        {/* Visuel principal — image unique, centrée, pleine largeur */}
        <div className="relative w-full mx-auto" style={imgIntroStyle(stagger.images, parallax * 0.4)}>
          {/* Halo lumineux dédié derrière l'image (studio futuriste, subtil) */}
          <div
            aria-hidden
            className="absolute -inset-6 md:-inset-10 pointer-events-none hero-glow-drift-slow"
            style={{
              background: `
                radial-gradient(closest-side, rgba(232,121,46,0.30), transparent 70%) 30% 20% / 65% 65% no-repeat,
                radial-gradient(closest-side, rgba(46,140,255,0.22), transparent 70%) 85% 75% / 60% 60% no-repeat,
                radial-gradient(closest-side, rgba(245,197,66,0.16), transparent 70%) 60% 95% / 55% 55% no-repeat
              `,
              filter: "blur(6px)",
            }}
          />

          <div className="relative rounded-lg overflow-hidden w-full neon-border hero-float-a">
            <div
              aria-hidden
              className="absolute -inset-3 rounded-xl pointer-events-none"
              style={{
                background: `radial-gradient(closest-side, rgba(232,121,46,0.35), transparent 72%)`,
                filter: "blur(18px)",
                zIndex: -1,
              }}
            />
            <img
              src={HERO_SRC}
              alt="Bienvenue chez King Outlet"
              className="w-full h-auto max-h-[560px] xs:max-h-[640px] sm:max-h-[720px] md:max-h-[820px] lg:max-h-[920px] xl:max-h-[980px] object-contain mx-auto"
              onError={handleImgError}
              loading="eager"
              decoding="async"
            />
            <div
              aria-hidden
              className="absolute inset-0"
              style={{ boxShadow: "inset 0 0 60px rgba(232,121,46,0.10)" }}
            />
          </div>
        </div>

        {/* Boutons — sous l'image principale, centrés */}
        <div className="relative z-10 mt-8 md:mt-10 flex justify-center" style={introStyle(stagger.cta, 14)}>
          <div className="flex flex-wrap gap-4 justify-center">
            <button
              onClick={() => go("catalog")}
              className="hero-cta-primary btn-shine px-8 py-4 text-sm uppercase tracking-widest font-semibold rounded-sm transition-transform active:scale-95"
              style={{
                background: `linear-gradient(90deg, ${COLORS.purple}, ${COLORS.magenta})`,
                color: "#0F0806",
                fontFamily: "Inter",
                boxShadow: "0 0 22px rgba(245,197,66,0.55), 0 0 50px rgba(232,121,46,0.25)",
              }}
            >
              Découvrir la collection
            </button>

            <GhostButton onClick={() => go("catalog-new")}>
              Voir les nouveautés
            </GhostButton>
          </div>
        </div>

        {/* Rouleau des marques — déplacé sous le bouton "Voir les nouveautés" */}
        <div className="mt-10 md:mt-14 -mx-5 md:-mx-10">
          <BrandMarquee />
        </div>
      </div>

      {/* Indicateur de scroll — discret */}
      <div
        className="hidden sm:flex justify-center relative z-10"
        style={{ ...introStyle(stagger.cta + 160, 8), marginTop: 6 }}
      >
        <div className="flex flex-col items-center gap-2 pb-2">
          <span
            className="text-[10px] uppercase tracking-[0.3em]"
            style={{ color: COLORS.inkDim, fontFamily: "Inter" }}
          >
            Découvrir
          </span>
          <span className="hero-scroll-dot" aria-hidden />
        </div>
      </div>
    </section>
  );
}

  const [size, setSize] = useState("all");
  const [color, setColor] = useState("all");
  const [onlyNew, setOnlyNew] = useState(!!forceNew);
  const [onlyFeatured, setOnlyFeatured] = useState(!!forceFeatured);
  const [sort, setSort] = useState("relevance");
  const [mobileFilters, setMobileFilters] = useState(false);

  useEffect(() => { setCategory(initialCategory || "all"); }, [initialCategory]);
  useEffect(() => { setBrand(initialBrand || "all"); }, [initialBrand]);
  useEffect(() => { setGender(initialGender || "all"); }, [initialGender]);
  useEffect(() => { setSubcategory(initialSubcategory || "all"); }, [initialSubcategory]);
  useEffect(() => { setOnlyNew(!!forceNew); }, [forceNew]);
  useEffect(() => { setOnlyFeatured(!!forceFeatured); }, [forceFeatured]);

  const allSizes = useMemo(() => Array.from(new Set(products.flatMap((p) => p.sizes))).sort(), [products]);
  const allColors = useMemo(() => Array.from(new Set(products.flatMap((p) => p.colors))), [products]);

  // Genre / sous-catégories disponibles pour la catégorie actuellement sélectionnée
  // (vide si la catégorie n'a pas de niveau Genre/Sous-catégorie, ex : Montres)
  const gendersAvailable = category !== "all" ? gendersForCategory(category) : [];
  const subcatsAvailable =
    category !== "all"
      ? (gendersAvailable.length > 0
          ? (gender !== "all" ? subcatsForCategory(category, gender) : allSubcatsForCategory(category))
          : allSubcatsForCategory(category))
      : [];

  const filtered = useMemo(() => {
    let list = products.filter((p) => {
      if (search && !(`${p.name} ${p.reference}`.toLowerCase().includes(search.toLowerCase()))) return false;
      if (category !== "all" && p.categoryId !== category) return false;
      if (brand !== "all" && p.brandId !== brand) return false;
      if (gender !== "all" && p.gender !== gender) return false;
      if (subcategory !== "all" && p.subcategory !== subcategory) return false;
      if (size !== "all" && !p.sizes.includes(size)) return false;
      if (color !== "all" && !p.colors.includes(color)) return false;
      if (onlyNew && !p.isNew) return false;
      if (onlyFeatured && !p.featured) return false;
      return true;
    });
    if (sort === "name") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    if (sort === "new") list = [...list].sort((a, b) => Number(b.isNew) - Number(a.isNew));
    return list;
  }, [products, search, category, brand, gender, subcategory, size, color, onlyNew, onlyFeatured, sort]);

  const Filters = () => (
    <div className="space-y-6">
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Catégorie</label>
        <select
          value={category}
          onChange={(e) => { setCategory(e.target.value); setGender("all"); setSubcategory("all"); }}
          className="w-full px-3 py-2 text-sm rounded-sm"
          style={selectStyle}
        >
          <option value="all">Toutes</option>
          {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      {gendersAvailable.length > 0 && (
        <div>
          <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Genre</label>
          <select
            value={gender}
            onChange={(e) => { setGender(e.target.value); setSubcategory("all"); }}
            className="w-full px-3 py-2 text-sm rounded-sm"
            style={selectStyle}
          >
            <option value="all">Tous</option>
            {gendersAvailable.map((g) => <option key={g} value={g}>{GENDER_LABELS[g]}</option>)}
          </select>
        </div>
      )}
      {subcatsAvailable.length > 0 && (
        <div>
          <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Sous-catégorie</label>
          <select value={subcategory} onChange={(e) => setSubcategory(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
            <option value="all">Toutes</option>
            {subcatsAvailable.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
      )}
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Marque</label>
        <select value={brand} onChange={(e) => setBrand(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
          <option value="all">Toutes</option>
          {brands.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
        </select>
      </div>
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Taille</label>
        <select value={size} onChange={(e) => setSize(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
          <option value="all">Toutes</option>
          {allSizes.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      <div>
        <label className="text-[11px] uppercase tracking-widest block mb-2" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Couleur</label>
        <select value={color} onChange={(e) => setColor(e.target.value)} className="w-full px-3 py-2 text-sm rounded-sm" style={selectStyle}>
          <option value="all">Toutes</option>
          {allColors.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <label className="flex items-center gap-2 text-sm" style={{ fontFamily: "Inter", color: COLORS.ink }}>
        <input type="checkbox" checked={onlyNew} onChange={(e) => setOnlyNew(e.target.checked)} />
        Nouveautés uniquement
      </label>
      <label className="flex items-center gap-2 text-sm" style={{ fontFamily: "Inter", color: COLORS.ink }}>
        <input type="checkbox" checked={onlyFeatured} onChange={(e) => setOnlyFeatured(e.target.checked)} />
        Mis en avant uniquement
      </label>
      <button
        onClick={() => { setSearch(""); setCategory("all"); setBrand("all"); setGender("all"); setSubcategory("all"); setSize("all"); setColor("all"); setOnlyNew(false); setOnlyFeatured(false); }}
        className="text-xs uppercase tracking-widest underline"
        style={{ color: COLORS.magenta, fontFamily: "Inter" }}
      >
        Réinitialiser les filtres
      </button>
    </div>
  );

  return (
    <section className="max-w-7xl mx-auto px-5 md:px-8 py-12">
      <Eyebrow>Catalogue</Eyebrow>
      <div className="flex items-end justify-between flex-wrap gap-4 mt-3 mb-8">
        <h1 style={{ fontFamily: "Anton", fontSize: "clamp(28px,5vw,44px)", color: COLORS.ink }}>TOUT LE CATALOGUE</h1>
        <div className="flex items-center gap-3 flex-wrap">
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Rechercher un produit, une référence…"
            className="px-4 py-2.5 text-sm rounded-sm w-64 max-w-full"
            style={selectStyle}
          />
          <select value={sort} onChange={(e) => setSort(e.target.value)} className="px-3 py-2.5 text-sm rounded-sm" style={selectStyle}>
            <option value="relevance">Pertinence</option>
            <option value="name">Nom (A–Z)</option>
            <option value="new">Nouveautés d'abord</option>
          </select>
          <button
            className="lg:hidden px-4 py-2.5 text-xs uppercase tracking-widest border rounded-sm"
            style={{ borderColor: COLORS.line, color: COLORS.ink, fontFamily: "Inter" }}
            onClick={() => setMobileFilters(true)}
          >
            Filtres
          </button>
        </div>
      </div>

      <div className="grid lg:grid-cols-[220px_1fr] gap-10">
        <aside className="hidden lg:block">
          <Filters />
        </aside>

        <div>
          <div className="text-xs mb-4" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>{filtered.length} produit{filtered.length > 1 ? "s" : ""}</div>
          {filtered.length === 0 ? (
            <div className="py-24 text-center border rounded-sm" style={{ borderColor: COLORS.line }}>
              <div style={{ fontFamily: "Anton", fontSize: 24, color: COLORS.ink }}>AUCUN RÉSULTAT</div>
              <p className="mt-2 text-sm" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>Essayez d'élargir vos filtres ou votre recherche.</p>
            </div>
          ) : (
            <RevealGroup className="grid grid-cols-2 md:grid-cols-3 gap-5 md:gap-6" step={50} y={22}>
              {filtered.map((p) => (
                <ProductCard key={p.id} product={p} brand={brands.find((b) => b.id === p.brandId)} onOpen={onOpen} />
              ))}
            </RevealGroup>
          )}
        </div>
      </div>

      {mobileFilters && (
        <div className="fixed inset-0 z-50 lg:hidden">
          <div className="absolute inset-0 bg-black/70" onClick={() => setMobileFilters(false)} />
          <div className="absolute right-0 top-0 bottom-0 w-80 max-w-[85vw] p-6 overflow-y-auto" style={{ background: COLORS.surface }}>
            <div className="flex items-center justify-between mb-6">
              <div style={{ fontFamily: "Anton", fontSize: 20, color: COLORS.ink }}>FILTRES</div>
              <button onClick={() => setMobileFilters(false)} style={{ color: COLORS.ink }}>✕</button>
            </div>
            <Filters />
            <SolidButton className="w-full mt-6" onClick={() => setMobileFilters(false)}>Voir les résultats</SolidButton>
          </div>
        </div>
      )}
    </section>
  );
}

const selectStyle = {
  background: COLORS.surface,
  border: `1px solid ${COLORS.line}`,
  color: COLORS.ink,
  fontFamily: "Inter",
};

/* ---------------- Product page ---------------- */

function ProductGallery({ product }) {
  const [activeImg, setActiveImg] = useState(0);
  const [displayImg, setDisplayImg] = useState(0);
  const [fading, setFading] = useState(false);
  const [zoomOpen, setZoomOpen] = useState(false);
  const touchStart = useRef(null);
  const fadeTimeout = useRef(null);

  useEffect(() => {
    setActiveImg(0);
    setDisplayImg(0);
  }, [product.id]);

  useEffect(() => {
    if (displayImg === activeImg) return;
    setFading(true);
    fadeTimeout.current && clearTimeout(fadeTimeout.current);
    fadeTimeout.current = setTimeout(() => {
      setDisplayImg(activeImg);
      setFading(false);
    }, 160);
    return () => fadeTimeout.current && clearTimeout(fadeTimeout.current);
  }, [activeImg]);

  const goTo = (i) => setActiveImg(((i % product.images.length) + product.images.length) % product.images.length);

  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStart.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStart.current;
    if (dx > 50) goTo(activeImg - 1);
    if (dx < -50) goTo(activeImg + 1);
    touchStart.current = null;
  };

  return (
    <div className="w-full max-w-full min-w-0">
      {/* Image principale — carrée, cadrage net, produit centré sans vide excessif.
          Cadre 100% de la largeur disponible, jamais plus large que l'écran ; l'image est
          toujours contenue et centrée à l'intérieur (object-contain + flex center), jamais
          déformée, jamais débordante. */}
      <div
        className="relative w-full max-w-full rounded-lg overflow-hidden cursor-zoom-in select-none"
        style={{
          aspectRatio: "1/1",
          background: `radial-gradient(120% 100% at 50% 8%, ${COLORS.surface2} 0%, ${COLORS.surface} 55%, #0C0913 100%)`,
          boxShadow: `0 0 0 1px ${COLORS.line}, 0 30px 60px -30px rgba(0,0,0,0.7)`,
        }}
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
        onClick={() => setZoomOpen(true)}
      >
        <div className="absolute inset-0 flex items-center justify-center p-5 sm:p-7">
          <img
            src={product.images[displayImg]}
            alt={product.name}
            className="max-w-full max-h-full w-auto h-auto object-contain drop-shadow-[0_25px_40px_rgba(0,0,0,0.55)] transition-all duration-300 ease-out"
            style={{ opacity: fading ? 0 : 1, transform: fading ? "scale(0.985)" : "scale(1)" }}
            onError={handleImgError}
            loading="eager"
            decoding="async"
          />
        </div>
        <TagCorner />
        {product.images.length > 1 && (
          <div
            className="absolute bottom-3 right-3 px-2.5 py-1 rounded-sm text-[10px] font-mono"
            style={{ background: "rgba(15,8,6,0.65)", color: COLORS.inkDim }}
          >
            {displayImg + 1} / {product.images.length}
          </div>
        )}
        <div
          className="absolute bottom-3 left-3 px-2.5 py-1 rounded-sm text-[10px] uppercase tracking-widest hidden sm:flex items-center gap-1"
          style={{ background: "rgba(15,8,6,0.55)", color: COLORS.inkDim, fontFamily: "Inter" }}
        >
          ⤢ Cliquer pour zoomer
        </div>
      </div>

      {/* Miniatures — carrées, nettes, cadrage cohérent avec l'image principale.
          Rangée en défilement horizontal CONTENU (overflow-x-auto + w-full + min-w-0) : c'est
          le seul endroit de la page où un défilement horizontal est volontaire et acceptable —
          il reste strictement à l'intérieur de son propre cadre, jamais sur toute la page. */}
      {product.images.length > 1 && (
        <div className="flex gap-3 mt-4 w-full max-w-full min-w-0 overflow-x-auto overscroll-x-contain pb-1">
          {product.images.map((im, i) => (
            <button
              key={i}
              onClick={() => goTo(i)}
              className="relative shrink-0 rounded-md overflow-hidden transition-all duration-200"
              style={{
                width: 68,
                height: 68,
                background: `radial-gradient(120% 120% at 50% 10%, ${COLORS.surface2} 0%, ${COLORS.surface} 100%)`,
                boxShadow: activeImg === i ? `0 0 0 2px ${COLORS.magenta}, 0 0 14px rgba(245,197,66,0.4)` : `0 0 0 1px ${COLORS.line}`,
                opacity: activeImg === i ? 1 : 0.55,
              }}
            >
              <img src={im} alt="" className="absolute inset-0 w-full h-full object-contain p-1.5" onError={handleImgError} loading="lazy" />
            </button>
          ))}
        </div>
      )}

      {/* Rendu via portail directement dans <body> : la galerie est nichée dans un ancêtre animé
          (transform CSS actif en permanence pour l'effet d'apparition au scroll), ce qui casserait
          le positionnement "fixed" plein écran de ce zoom s'il restait dans l'arbre React normal. */}
      {zoomOpen && ReactDOM.createPortal(
        <div
          className="fixed inset-0 z-[70] flex items-center justify-center p-4 sm:p-10"
          style={{ background: "rgba(5,4,9,0.94)" }}
          onClick={() => setZoomOpen(false)}
        >
          <button
            onClick={() => setZoomOpen(false)}
            className="absolute top-4 right-4 sm:top-6 sm:right-6 w-10 h-10 rounded-full flex items-center justify-center text-lg"
            style={{ background: COLORS.surface2, color: COLORS.ink }}
            aria-label="Fermer le zoom"
          >
            ✕
          </button>
          <img
            src={product.images[displayImg]}
            alt={product.name}
            className="max-w-full max-h-full object-contain"
            onClick={(e) => e.stopPropagation()}
            onError={handleImgError}
          />
          {product.images.length > 1 && (
            <>
              <button
                onClick={(e) => { e.stopPropagation(); goTo(activeImg - 1); }}
                className="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full flex items-center justify-center"
                style={{ background: "rgba(255,255,255,0.08)", color: COLORS.ink }}
                aria-label="Image précédente"
              >‹</button>
              <button
                onClick={(e) => { e.stopPropagation(); goTo(activeImg + 1); }}
                className="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full flex items-center justify-center"
                style={{ background: "rgba(255,255,255,0.08)", color: COLORS.ink }}
                aria-label="Image suivante"
              >›</button>
            </>
          )}
        </div>,
        document.body
      )}
    </div>
  );
}

/* Ligne détail produit — libellé au-dessus de la valeur sur mobile (empêche tout débordement
   horizontal avec des valeurs longues), côte-à-côte à partir de "sm". La valeur revient toujours
   à la ligne librement (jamais de troncature ni de dépassement d'écran). */
function DetailRow({ label, value, mono }) {
  if (value == null || value === "") return null;
  return (
    <div className="flex flex-col gap-0.5 sm:flex-row sm:items-baseline sm:justify-between sm:gap-6">
      <span className="shrink-0">{label}</span>
      <span
        className={`break-words sm:text-right ${mono ? "font-mono" : ""}`}
        style={{ color: COLORS.ink }}
      >
        {value}
      </span>
    </div>
  );
}

/* Accordéon compact — une section ouverte à la fois, pour éviter les pavés de texte empilés */
function InfoAccordion({ sections, defaultOpen }) {
  const [openId, setOpenId] = useState(defaultOpen || null);
  return (
    <div className="mt-7 border-t" style={{ borderColor: COLORS.line }}>
      {sections.map((s) => {
        const isOpen = openId === s.id;
        return (
          <div key={s.id} className="border-b" style={{ borderColor: COLORS.line }}>
            <button
              onClick={() => setOpenId(isOpen ? null : s.id)}
              className="w-full flex items-center justify-between py-4 text-left"
            >
              <span className="text-xs uppercase tracking-widest font-semibold" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{s.label}</span>
              <svg
                width="11" height="11" viewBox="0 0 9 9" fill="none"
                style={{ transition: "transform .2s ease", transform: isOpen ? "rotate(180deg)" : "rotate(0deg)", flexShrink: 0 }}
              >
                <path d="M1 2.5L4.5 6L8 2.5" stroke={COLORS.inkDim} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </button>
            <div
              style={{
                maxHeight: isOpen ? 600 : 0,
                overflow: "hidden",
                transition: "max-height .3s ease",
              }}
            >
              <div className="pb-4 text-sm leading-relaxed" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
                {s.content}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ProductPage({ product, brand, products, brands, onOpen, go, onAddToCart }) {
  const [selSize, setSelSize] = useState(product.sizes[0] || null);
  const [selColor, setSelColor] = useState(product.colors[0] || null);
  const [qty, setQty] = useState(1);
  const [descExpanded, setDescExpanded] = useState(false);
  const [justAdded, setJustAdded] = useState(false);

  useEffect(() => { setSelSize(product.sizes[0] || null); setSelColor(product.colors[0] || null); setQty(1); setDescExpanded(false); }, [product.id]);

  const similar = products.filter((p) => p.id !== product.id && p.categoryId === product.categoryId).slice(0, 4);
  const categoryLabel = CATEGORIES.find((c) => c.id === product.categoryId)?.name;
  const genderLabel = product.gender ? GENDER_LABELS[product.gender] : null;
  const isShoe = product.categoryId === "chaussures";
  const isLongDesc = (product.description || "").length > 140;

  const handleAddToCart = () => {
    onAddToCart({
      productId: product.id,
      name: product.name,
      brandName: brand?.name || "",
      reference: product.reference || "",
      price: product.price != null ? product.price : null,
      image: product.images && product.images[0] ? product.images[0] : null,
      size: selSize || null,
      sizeLabel: isShoe ? "Pointure" : "Taille",
      color: selColor || null,
      quantity: qty,
      categoryId: product.categoryId,
      availability: normalizeAvailability(product.availability),
    });
    setJustAdded(true);
    setTimeout(() => setJustAdded(false), 1800);
  };

  return (
    <section className="max-w-7xl mx-auto px-5 md:px-8 py-10 overflow-x-hidden">
      <button onClick={() => go("catalog")} className="text-xs uppercase tracking-widest mb-6 inline-flex items-center gap-1.5" style={{ color: COLORS.inkDim, fontFamily: "Inter" }}>
        ← Retour au catalogue
      </button>

      {/* min-w-0 sur les deux colonnes : empêche une grille CSS de forcer la largeur d'un
          élément (galerie, miniatures, texte long) au-delà de la largeur d'écran disponible —
          cause racine des débordements horizontaux constatés sur mobile. */}
      <div className="grid md:grid-cols-2 gap-10 lg:gap-16 w-full max-w-full overflow-x-hidden md:overflow-visible">
        {/* Galerie — dominante */}
        <Reveal y={22} className="min-w-0 w-full max-w-full">
          <ProductGallery product={product} />
        </Reveal>

        {/* Informations — structure éditoriale */}
        <Reveal delay={120} y={22} className="min-w-0 w-full max-w-full">
          <div className="min-w-0">
            <div className="text-xs uppercase tracking-widest" style={{ color: COLORS.magenta, fontFamily: "Inter" }}>{brand?.name}</div>
            <h1 className="mt-2 leading-tight break-words" style={{ fontFamily: "Anton", fontSize: "clamp(30px,4vw,44px)", color: COLORS.ink }}>{product.name.toUpperCase()}</h1>
            <div className="mt-2 flex items-center gap-3 flex-wrap">
              <span className="text-xs font-mono break-words" style={{ color: COLORS.inkDim }}>Réf. {product.reference}</span>
              {product.price != null && (
                <span className="text-lg font-semibold" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{product.price} €</span>
              )}
              {(() => {
                const info = getAvailabilityInfo(product.availability);
                return <Badge tone={info.badgeTone}>{info.emoji} {info.label}</Badge>;
              })()}
            </div>

            {/* Disponibilité + délai de livraison — toujours visible près des
                informations principales du produit, texte strictement identique
                à celui utilisé ailleurs sur le site (cartes, panier, accordéon). */}
            <div
              className="mt-4 text-xs sm:text-sm"
              style={{ color: COLORS.inkDim, fontFamily: "Inter" }}
            >
              {(() => {
                const info = getAvailabilityInfo(product.availability);
                return (
                  <span>
                    <span className="uppercase tracking-widest font-semibold" style={{ color: COLORS.ink }}>
                      {info.emoji} {info.statusLine}
                    </span>
                    {" — "}
                    {info.deliveryText}
                  </span>
                );
              })()}
            </div>

            {product.description && (
              <div className="mt-6 max-w-xl">
                <p
                  className="text-sm leading-relaxed break-words"
                  style={{
                    color: COLORS.inkDim,
                    fontFamily: "Inter",
                    display: "-webkit-box",
                    WebkitBoxOrient: "vertical",
                    WebkitLineClamp: descExpanded ? "unset" : 3,
                    overflow: descExpanded ? "visible" : "hidden",
                  }}
                >
                  {product.description}
                </p>
                {isLongDesc && (
                  <button
                    onClick={() => setDescExpanded((v) => !v)}
                    className="mt-1.5 text-xs uppercase tracking-widest font-semibold"
                    style={{ color: COLORS.magenta, fontFamily: "Inter" }}
                  >
                    {descExpanded ? "Réduire ↑" : "Lire plus ↓"}
                  </button>
                )}
              </div>
            )}

/* Carrousel léger — sans dépendance externe : scroll horizontal natif (swipe tactile inclus)
   + flèches desktop + indicateurs. Perf : transform/scroll uniquement. */
function ReviewsCarousel({ reviews }) {
  const trackRef = useRef(null);
  const [activeIndex, setActiveIndex] = useState(0);

  const scrollByCard = (dir) => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector("[data-review-card]");
    const cardWidth = card ? card.getBoundingClientRect().width + 20 : 320;
    el.scrollBy({ left: dir * cardWidth, behavior: prefersReducedMotion ? "auto" : "smooth" });
  };

  const onScroll = () => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector("[data-review-card]");
    const cardWidth = card ? card.getBoundingClientRect().width + 20 : 320;
    const idx = Math.round(el.scrollLeft / cardWidth);
    setActiveIndex(Math.max(0, Math.min(reviews.length - 1, idx)));
  };

  const goToIndex = (i) => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector("[data-review-card]");
    const cardWidth = card ? card.getBoundingClientRect().width + 20 : 320;
    el.scrollTo({ left: i * cardWidth, behavior: prefersReducedMotion ? "auto" : "smooth" });
  };

  if (reviews.length === 0) return null;

  return (
    <div className="relative">
      {/* Flèches — desktop uniquement, cachées si peu d'avis */}
      {reviews.length > 3 && (
        <>
          <button
            onClick={() => scrollByCard(-1)}
            className="hidden md:flex absolute -left-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full items-center justify-center transition-transform hover:scale-110"
            style={{ background: COLORS.surface2, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            aria-label="Avis précédent"
          >
            ‹
          </button>
          <button
            onClick={() => scrollByCard(1)}
            className="hidden md:flex absolute -right-4 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full items-center justify-center transition-transform hover:scale-110"
            style={{ background: COLORS.surface2, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            aria-label="Avis suivant"
          >
            ›
          </button>
        </>
      )}

      <div
        ref={trackRef}
        onScroll={onScroll}
        className="flex gap-5 overflow-x-auto pb-2 snap-x snap-mandatory reviews-track"
        style={{ scrollbarWidth: "none" }}
      >
        {reviews.map((r) => (
          <div key={r.id} data-review-card className="snap-start">
            <ReviewCard review={r} />
          </div>
        ))}
      </div>

      {/* Indicateurs */}
      {reviews.length > 1 && (
        <div className="flex items-center justify-center gap-2 mt-5">
          {reviews.map((r, i) => (
            <button
              key={r.id}
              onClick={() => goToIndex(i)}
              aria-label={`Aller à l'avis ${i + 1}`}
              className="rounded-full transition-all duration-300"
              style={{
                width: i === activeIndex ? 20 : 6,
                height: 6,
                background: i === activeIndex ? COLORS.magenta : COLORS.line,
                boxShadow: i === activeIndex ? "0 0 8px rgba(245,197,66,0.6)" : "none",
              }}
            />
          ))}
        </div>
      )}
    </div>
  );
}

/* Avis vidéo — n'héberge jamais le média : simple lien externe cliquable (TikTok / Instagram / YouTube / autre). */
function VideoTestimonialCard({ testimonial }) {
  const videoRef = useRef(null);
  const [isPlaying, setIsPlaying] = useState(false);
  const hasUrl = !!testimonial.videoUrl;

  const togglePlay = () => {
    const el = videoRef.current;
    if (!el) return;
    if (el.paused) {
      el.play();
      setIsPlaying(true);
    } else {
      el.pause();
      setIsPlaying(false);
    }
  };

  return (
    <div
      className="review-card relative shrink-0 rounded-lg overflow-hidden transition-all duration-300"
      style={{
        width: "min(220px, 60vw)",
        aspectRatio: "9/16",
        background: `linear-gradient(160deg, ${COLORS.surface2} 0%, ${COLORS.surface} 100%)`,
        border: `1px solid ${COLORS.line}`,
        boxShadow: "0 20px 40px -24px rgba(0,0,0,0.6)",
      }}
    >
      {hasUrl ? (
        <>
          <video
            ref={videoRef}
            src={testimonial.videoUrl}
            className="absolute inset-0 w-full h-full object-cover"
            playsInline
            controls={isPlaying}
            onPause={() => setIsPlaying(false)}
            onEnded={() => setIsPlaying(false)}
            preload="metadata"
          />
          {!isPlaying && (
            <button
              onClick={togglePlay}
              aria-label={`Lire le témoignage vidéo de ${testimonial.firstName}`}
              className="absolute inset-0 flex flex-col items-center justify-end gap-2 p-4 text-center"
              style={{ background: "linear-gradient(180deg, transparent 55%, rgba(15,8,6,0.85))" }}
            >
              <div
                className="w-12 h-12 rounded-full flex items-center justify-center mb-2"
                style={{
                  background: `linear-gradient(135deg, ${COLORS.purple}, ${COLORS.magenta})`,
                  boxShadow: "0 0 18px rgba(245,197,66,0.5)",
                }}
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="#0F0806"><path d="M4 2.5v11l9-5.5-9-5.5z" /></svg>
              </div>
              <div className="text-xs font-semibold" style={{ color: COLORS.ink, fontFamily: "Inter" }}>{testimonial.firstName}</div>
            </button>
          )}
        </>
      ) : (
        <div
          aria-hidden
          className="absolute inset-0 opacity-70"
          style={{
            background: `radial-gradient(120% 80% at 50% 100%, rgba(232,121,46,0.28), transparent 60%)`,
          }}
        />
      )}
    </div>
  );
}
